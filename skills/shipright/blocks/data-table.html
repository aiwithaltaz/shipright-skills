<!DOCTYPE html>
<html lang="en" data-interaction="click" data-expect="selected">
<!--
Block: data-table
Job: Bold line, muted sub-line, sort, full-border selection, and a next step.
Use when: a list the user compares
Do not use when: you have fewer than three items and no columns
Attributes: data-selectable
Size: 3 KB
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crews</title>
<style>

  :root { --ink:#1c1916; --paper:#f7f6f3; --card:#fff; --line:#6f6a62; --accent:#145c3a; --muted:#4e4943; }
  * { box-sizing: border-box; }
  html, body { margin: 0; max-width: 100%; }
  body { font: 16px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.4px; }
  p { margin: 8px 0 0; }
  button, [role="option"] { font: inherit; color: inherit; }
  button { min-height: 44px; min-width: 44px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--ink); background: var(--card); cursor: pointer; }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .out { margin-top: 8px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }


    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 8px; vertical-align: top; }
    tr.selected { outline: 1px solid var(--ink); outline-offset: -1px; }
    .sub { color: var(--muted); display: block; }
    
</style>
</head>
<body>
<main>
<p data-keep-text>Rows keep their names at every width.</p>
<h1>Crews</h1>
<table data-selectable="true">
      <thead><tr><th><button type="button" id="sort">Name</button></th><th>Next</th></tr></thead>
      <tbody>
        <tr id="row"><td>North crew <span class="sub">Weekly mow, 1h, $55</span></td><td><button type="button" data-test="run">Select</button></td></tr>
        <tr><td>East crew <span class="sub">Hedge trim, 2h, $90</span></td><td><button type="button">Select</button></td></tr>
      </tbody>
    </table>
<p class="out" data-test="out">idle</p>
</main>
<script>

    document.querySelector('[data-test=run]').addEventListener('click', () => {
      document.querySelectorAll('tr').forEach(tr => tr.classList.remove('selected'));
      document.getElementById('row').classList.add('selected');
      document.querySelector('[data-test=out]').textContent = 'selected';
    });
    document.getElementById('sort').addEventListener('click', () => {
      const body = document.querySelector('tbody');
      [...body.rows].reverse().forEach(row => body.appendChild(row));
    });
    
</script>
</body>
</html>
