<!DOCTYPE html>
<html lang="en" data-interaction="click" data-expect="selected">
<!--
Block: data-table
Job: Bold line, muted sub-line, sort, full-border selection, and a next step.
Use when: a list the user compares
Do not use when: you have fewer than three items and no columns
Attributes: data-selectable
Size: 4 KB
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crews</title>
<style>

@import url("fonts/fonts.css");
  :root {
    --ink:#1c1916; --paper:#f7f6f3; --card:#fff; --line:#6f6a62; --accent:#145c3a; --muted:#4e4943;
    --space-1:4px; --space-2:8px; --space-3:16px; --space-4:24px; --space-5:32px; --space-6:40px; --space-7:48px; --space-8:64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; max-width: 100%; }
  body { font-family: "Inter", system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--paper); }
  a { color: inherit; text-decoration: none; }
  .mast { max-width: 960px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .mast b { font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 16px; }
  .mast span, .kicker { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  main { max-width: 960px; margin: 0 auto; padding: 48px 24px 64px; }
  h1, h2 { font-family: "Fraunces", Georgia, serif; font-weight: 400; line-height: 1.2; }
  h1 { font-size: 40px; margin: 8px 0 16px; }
  h2 { font-size: 24px; margin: 0 0 8px; }
  .kicker { margin: 0 0 8px; }
  p { margin: 8px 0 0; }
  [data-keep-text] { margin: 0 0 16px; max-width: 40em; color: var(--muted); }
  button, [role="option"] { font: inherit; color: inherit; }
  button { min-height: 44px; min-width: 44px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--ink); background: var(--card); cursor: pointer; }
  button[data-test="run"]:not(.row) { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .out { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
  @media (max-width: 800px) {
    main { padding: 32px 16px 48px; }
    h1 { font-size: 32px; }
    .mast { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }


    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 8px; vertical-align: top; }
    tr.selected { outline: 1px solid var(--ink); outline-offset: -1px; }
    .sub { color: var(--muted); display: block; }
    
</style>
</head>
<body>
<header class="mast"><b>Table</b><span>Demo data</span></header>
<main>
<p data-keep-text>Rows keep their names at every width.</p>
<p class="kicker">Table</p>
<h1>Crews</h1>
<table data-selectable="true">
      <thead><tr><th><button type="button" id="sort">Name</button></th><th>Next</th></tr></thead>
      <tbody>
        <tr id="row"><td>North crew <span class="sub">Weekly mow, 1h, $55</span></td><td><button type="button" data-test="run">Select</button></td></tr>
        <tr><td>East crew <span class="sub">Hedge trim, 2h, $90</span></td><td><button type="button">Select</button></td></tr>
      </tbody>
    </table>
<p class="out" data-test="out">idle</p>
</main>
<script>

    document.querySelector('[data-test=run]').addEventListener('click', () => {
      document.querySelectorAll('tr').forEach(tr => tr.classList.remove('selected'));
      document.getElementById('row').classList.add('selected');
      document.querySelector('[data-test=out]').textContent = 'selected';
    });
    document.getElementById('sort').addEventListener('click', () => {
      const body = document.querySelector('tbody');
      [...body.rows].reverse().forEach(row => body.appendChild(row));
    });
    
</script>
</body>
</html>
