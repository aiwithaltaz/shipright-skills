<!DOCTYPE html>
<html lang="en" data-interaction="click" data-expect="skipped">
<!--
Block: counter-preloader
Job: A 0 to 100 counter hides warm-up. Skip is always there. Reduced motion skips it.
Use when: a heavy scene needs a moment and the user must be able to skip
Do not use when: the page is already instant
Attributes: data-duration
Size: 3 KB
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ready when you are</title>
<style>

  :root { --ink:#1c1916; --paper:#f7f6f3; --card:#fff; --line:#6f6a62; --accent:#145c3a; --muted:#4e4943; }
  * { box-sizing: border-box; }
  html, body { margin: 0; max-width: 100%; }
  body { font: 16px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.4px; }
  p { margin: 8px 0 0; }
  button, [role="option"] { font: inherit; color: inherit; }
  button { min-height: 44px; min-width: 44px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--ink); background: var(--card); cursor: pointer; }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .out { margin-top: 8px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }


    .cover { position: fixed; inset: 0; background: var(--ink); color: var(--paper); display: grid; place-items: center; gap: 16px; }
    .cover[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) { .cover { display: none; } }
    
</style>
</head>
<body>
<main>
<p data-keep-text>The page content is available without waiting.</p>
<h1>Ready when you are</h1>
<div class="cover" id="cover" data-duration="600">
      <strong id="count">0</strong>
      <button type="button" data-test="run" id="skip">Skip</button>
    </div>
    <p>The product is ready.</p>
<p class="out" data-test="out">idle</p>
</main>
<script>

    const cover = document.getElementById('cover');
    const count = document.getElementById('count');
    let n = 0; let timer = 0;
    function finish(label) { cover.hidden = true; cancelAnimationFrame(timer); document.querySelector('[data-test=out]').textContent = label; }
    function tick() { n = Math.min(100, n + 1); count.textContent = String(n); if (n < 100 && !document.hidden) timer = requestAnimationFrame(tick); }
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduce) timer = requestAnimationFrame(tick);
    document.getElementById('skip').addEventListener('click', () => finish('skipped'));
    document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(timer); });
    
</script>
</body>
</html>
