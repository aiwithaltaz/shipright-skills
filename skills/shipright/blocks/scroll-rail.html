<!DOCTYPE html>
<html lang="en" data-interaction="click" data-expect="card-2">
<!--
Block: scroll-rail
Job: Vertical intent drives a horizontal row of cards without widening the page.
Use when: a set of equal stories should be stepped through
Do not use when: the user must compare all cards at once
Attributes: data-count
Size: 3 KB
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The week</title>
<style>

  :root { --ink:#1c1916; --paper:#f7f6f3; --card:#fff; --line:#6f6a62; --accent:#145c3a; --muted:#4e4943; }
  * { box-sizing: border-box; }
  html, body { margin: 0; max-width: 100%; }
  body { font: 16px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.4px; }
  p { margin: 8px 0 0; }
  button, [role="option"] { font: inherit; color: inherit; }
  button { min-height: 44px; min-width: 44px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--ink); background: var(--card); cursor: pointer; }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .out { margin-top: 8px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }


    .rail { margin-top: 16px; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
    .cards { display: flex; width: 100%; transition: transform 200ms cubic-bezier(.22,1,.36,1); }
    .card { min-width: 100%; padding: 16px; }
    @media (prefers-reduced-motion: reduce) { .cards { transform: none !important; display: grid; } .card { min-width: 0; } }
    
</style>
</head>
<body>
<main>
<p data-keep-text>Card text stays inside the viewport.</p>
<h1>The week</h1>
<div class="rail" data-count="3"><div class="cards" id="cards">
      <article class="card"><h2>Monday</h2><p>Plan the crews.</p></article>
      <article class="card"><h2>Rain day</h2><p>Move the outdoor visits.</p></article>
      <article class="card"><h2>Friday</h2><p>Send the invoices.</p></article>
    </div></div>
    <button type="button" data-test="run" id="next">Next card</button>
<p class="out" data-test="out">idle</p>
</main>
<script>

    let i = 0;
    const cards = document.getElementById('cards');
    document.getElementById('next').addEventListener('click', () => {
      i = Math.min(2, i + 1);
      cards.style.transform = 'translateX(' + (-i * 100) + '%)';
      document.querySelector('[data-test=out]').textContent = 'card-' + (i + 1);
    });
    
</script>
</body>
</html>
