<!DOCTYPE html>
<html lang="en" data-interaction="click" data-expect="error">
<!--
Block: form-kit
Job: Phone mask, blur checks, errors that reserve space, Back and Next.
Use when: a short form with a next step
Do not use when: you are only showing read-only facts
Attributes: data-mask
Size: 5 KB
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New customer</title>
<style>
[hidden] { display: none !important; }

@import url("fonts/fonts.css");
  :root {
    --ink:#1c1916; --paper:#f7f6f3; --card:#fff; --line:#6f6a62; --accent:#145c3a; --muted:#4e4943;
    --space-1:4px; --space-2:8px; --space-3:16px; --space-4:24px; --space-5:32px; --space-6:40px; --space-7:48px; --space-8:64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; max-width: 100%; }
  body { font-family: "Inter", system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--paper); }
  a { color: inherit; text-decoration: none; }
  .mast { max-width: 960px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .mast b { font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 16px; }
  .mast span, .kicker { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  main { max-width: 960px; margin: 0 auto; padding: 48px 24px 64px; }
  h1, h2 { font-family: "Fraunces", Georgia, serif; font-weight: 400; line-height: 1.2; }
  h1 { font-size: 40px; margin: 8px 0 16px; }
  h2 { font-size: 24px; margin: 0 0 8px; }
  .kicker { margin: 0 0 8px; }
  p { margin: 8px 0 0; }
  [data-keep-text] { margin: 0 0 16px; max-width: 40em; color: var(--muted); }
  button, [role="option"] { font: inherit; color: inherit; }
  button { min-height: 44px; min-width: 44px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--ink); background: var(--card); cursor: pointer; }
  button[data-test="run"]:not(.row) { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .out { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
  @media (max-width: 800px) {
    main { padding: 32px 16px 48px; }
    h1 { font-size: 32px; }
    .mast { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }


    label { display: block; margin-top: 16px; }
    input { width: 100%; max-width: 320px; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); padding: 8px 16px; font: inherit; }
    input:focus { border-color: var(--accent); outline: none; }
    .slot { min-height: 24px; color: #9f2d2d; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    
</style>
</head>
<body>
<header class="mast"><b>Form</b><span>Demo data</span></header>
<main>
<p data-keep-text>The error slot keeps its height so neighbors do not jump.</p>
<p class="kicker">Form</p>
<h1>New customer</h1>
<form id="form">
      <label>Phone <input name="phone" id="phone" data-mask="phone" inputmode="tel" autocomplete="tel"></label>
      <div class="slot" id="slot"></div>
      <div class="actions">
        <button type="button" id="back">← Back</button>
        <button type="submit" data-test="run">Next: Plan</button>
      </div>
    </form>
<p class="out" data-test="out">idle</p>
</main>
<script>

    const phone = document.getElementById('phone');
    const slot = document.getElementById('slot');
    function digits(v) { return v.replace(/\D/g, '').slice(0, 10); }
    function mask(v) {
      const d = digits(v);
      if (d.length < 4) return d;
      if (d.length < 7) return '(' + d.slice(0,3) + ') ' + d.slice(3);
      return '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6);
    }
    function check() {
      const ok = digits(phone.value).length === 10;
      slot.textContent = ok || phone.value === '' ? '' : 'Enter a 10-digit phone.';
      return ok;
    }
    phone.addEventListener('input', () => { phone.value = mask(phone.value); });
    phone.addEventListener('blur', check);
    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      document.querySelector('[data-test=out]').textContent = check() ? 'next' : 'error';
    });
    document.getElementById('back').addEventListener('click', () => { document.querySelector('[data-test=out]').textContent = 'back'; });
    
</script>
</body>
</html>
