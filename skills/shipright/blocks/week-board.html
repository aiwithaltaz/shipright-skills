<!DOCTYPE html>
<html lang="en" data-interaction="click" data-expect="moved">
<!--
Block: week-board
Job: Days as columns, a capacity bar, and a button to move work.
Use when: planning work across a week
Do not use when: there is only one date
Attributes: data-days
Size: 4 KB
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week of October 19</title>
<style>

@import url("fonts/fonts.css");
  :root {
    --ink:#1c1916; --paper:#f7f6f3; --card:#fff; --line:#6f6a62; --accent:#145c3a; --muted:#4e4943;
    --space-1:4px; --space-2:8px; --space-3:16px; --space-4:24px; --space-5:32px; --space-6:40px; --space-7:48px; --space-8:64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; max-width: 100%; }
  body { font-family: "Inter", system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--paper); }
  a { color: inherit; text-decoration: none; }
  .mast { max-width: 960px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .mast b { font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 16px; }
  .mast span, .kicker { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  main { max-width: 960px; margin: 0 auto; padding: 48px 24px 64px; }
  h1, h2 { font-family: "Fraunces", Georgia, serif; font-weight: 400; line-height: 1.2; }
  h1 { font-size: 40px; margin: 8px 0 16px; }
  h2 { font-size: 24px; margin: 0 0 8px; }
  .kicker { margin: 0 0 8px; }
  p { margin: 8px 0 0; }
  [data-keep-text] { margin: 0 0 16px; max-width: 40em; color: var(--muted); }
  button, [role="option"] { font: inherit; color: inherit; }
  button { min-height: 44px; min-width: 44px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--ink); background: var(--card); cursor: pointer; }
  button[data-test="run"]:not(.row) { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .out { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
  @media (max-width: 800px) {
    main { padding: 32px 16px 48px; }
    h1 { font-size: 32px; }
    .mast { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }


    .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
    .day { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; min-width: 0; }
    .bar { height: 8px; background: var(--paper); border-radius: 12px; margin: 8px 0; }
    .bar span { display: block; height: 8px; width: 70%; background: var(--accent); border-radius: 12px; }
    .chip { margin-top: 8px; }
    
</style>
</head>
<body>
<header class="mast"><b>Week board</b><span>Demo data</span></header>
<main>
<p data-keep-text>Each day name remains visible on a phone.</p>
<p class="kicker">Week board</p>
<h1>Week of October 19</h1>
<div class="board" data-days="3">
      <section class="day" id="mon"><h2>Mon</h2><div class="bar"><span></span></div><p class="chip" id="chip">9 visits</p></section>
      <section class="day" id="tue"><h2>Tue</h2><div class="bar"><span></span></div><p>Open</p></section>
      <section class="day"><h2>Wed</h2><p>Rain</p></section>
    </div>
    <button type="button" data-test="run" id="move">Move to Tuesday</button>
<p class="out" data-test="out">idle</p>
</main>
<script>
document.getElementById('move').addEventListener('click', () => { document.getElementById('tue').appendChild(document.getElementById('chip')); document.querySelector('[data-test=out]').textContent = 'moved'; });
</script>
</body>
</html>
