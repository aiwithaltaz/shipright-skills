<!DOCTYPE html>
<html lang="en" data-interaction="click" data-expect="separated">
<!--
Block: exploded-view
Job: Parts separate along one axis with numbered labels.
Use when: you need to show what is inside a product
Do not use when: the brief asks for a 3D explode. Use product-3d.
Attributes: data-gap
Size: 4 KB
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside the case</title>
<style>
[hidden] { display: none !important; }

@import url("fonts/fonts.css");
  :root {
    --ink:#1c1916; --paper:#f7f6f3; --card:#fff; --line:#6f6a62; --accent:#145c3a; --muted:#4e4943;
    --space-1:4px; --space-2:8px; --space-3:16px; --space-4:24px; --space-5:32px; --space-6:40px; --space-7:48px; --space-8:64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; max-width: 100%; }
  body { font-family: "Inter", system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--paper); }
  a { color: inherit; text-decoration: none; }
  .mast { max-width: 960px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .mast b { font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 16px; }
  .mast span, .kicker { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  main { max-width: 960px; margin: 0 auto; padding: 48px 24px 64px; }
  h1, h2 { font-family: "Fraunces", Georgia, serif; font-weight: 400; line-height: 1.2; }
  h1 { font-size: 40px; margin: 8px 0 16px; }
  h2 { font-size: 24px; margin: 0 0 8px; }
  .kicker { margin: 0 0 8px; }
  p { margin: 8px 0 0; }
  [data-keep-text] { margin: 0 0 16px; max-width: 40em; color: var(--muted); }
  button, [role="option"] { font: inherit; color: inherit; }
  button { min-height: 44px; min-width: 44px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--ink); background: var(--card); cursor: pointer; }
  button[data-test="run"]:not(.row) { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .out { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
  @media (max-width: 800px) {
    main { padding: 32px 16px 48px; }
    h1 { font-size: 32px; }
    .mast { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }


    .stack { display: grid; gap: 8px; margin-top: 16px; }
    .part { display: flex; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 16px; transition: transform 200ms cubic-bezier(.22,1,.36,1); }
    .part b { width: 24px; }
    .stack.apart .part:nth-child(1) { transform: translateY(-8px); }
    .stack.apart .part:nth-child(3) { transform: translateY(8px); }
    @media (prefers-reduced-motion: reduce) { .part { transform: none !important; } }
    
</style>
</head>
<body>
<header class="mast"><b>Exploded view</b><span>Demo data</span></header>
<main>
<p data-keep-text>Each part keeps its name when motion is off.</p>
<p class="kicker">Exploded view</p>
<h1>Inside the case</h1>
<div class="stack" id="stack" data-gap="8">
      <div class="part"><b>1</b> Top case</div>
      <div class="part"><b>2</b> Plate</div>
      <div class="part"><b>3</b> Battery</div>
    </div>
    <button type="button" data-test="run" id="sep">Separate</button>
<p class="out" data-test="out">idle</p>
</main>
<script>
document.getElementById('sep').addEventListener('click', () => { document.getElementById('stack').classList.add('apart'); document.querySelector('[data-test=out]').textContent = 'separated'; });
</script>
</body>
</html>
