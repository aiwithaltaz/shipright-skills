<!DOCTYPE html>
<html lang="en" data-interaction="click" data-expect="paused">
<!--
Block: attention-list
Job: Situation headline, a change versus normal, and one fixing action per row.
Use when: a work screen where something is wrong
Do not use when: a static brochure
Attributes: data-demo
Size: 4 KB
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7 actions left, about 13 min</title>
<style>

@import url("fonts/fonts.css");
  :root {
    --ink:#1c1916; --paper:#f7f6f3; --card:#fff; --line:#6f6a62; --accent:#145c3a; --muted:#4e4943;
    --space-1:4px; --space-2:8px; --space-3:16px; --space-4:24px; --space-5:32px; --space-6:40px; --space-7:48px; --space-8:64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; max-width: 100%; }
  body { font-family: "Inter", system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--paper); }
  a { color: inherit; text-decoration: none; }
  .mast { max-width: 960px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .mast b { font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 16px; }
  .mast span, .kicker { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  main { max-width: 960px; margin: 0 auto; padding: 48px 24px 64px; }
  h1, h2 { font-family: "Fraunces", Georgia, serif; font-weight: 400; line-height: 1.2; }
  h1 { font-size: 40px; margin: 8px 0 16px; }
  h2 { font-size: 24px; margin: 0 0 8px; }
  .kicker { margin: 0 0 8px; }
  p { margin: 8px 0 0; }
  [data-keep-text] { margin: 0 0 16px; max-width: 40em; color: var(--muted); }
  button, [role="option"] { font: inherit; color: inherit; }
  button { min-height: 44px; min-width: 44px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--ink); background: var(--card); cursor: pointer; }
  button[data-test="run"]:not(.row) { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .out { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
  @media (max-width: 800px) {
    main { padding: 32px 16px 48px; }
    h1 { font-size: 32px; }
    .mast { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }


    .tag { display: inline-block; border: 1px solid var(--line); border-radius: 12px; padding: 4px 8px; margin-top: 8px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 16px; margin-top: 8px; }
    
</style>
</head>
<body>
<header class="mast"><b>Attention</b><span>Demo data</span></header>
<main>
<p data-keep-text>Demo data is labeled next to the situation.</p>
<p class="kicker">Attention</p>
<h1>7 actions left, about 13 min</h1>
<p class="tag" data-sample="true">Demo data</p>
    <div class="row"><div><b>Invoice Matcher</b><p>Failure rate 18%, usually 2%.</p></div><button type="button" data-test="run" id="pause">Pause agent</button></div>
    <div class="row"><div><b>Lead Enricher</b><p>Spent $168 today, 2.9x usual.</p></div><button type="button">Cap at $150/day</button></div>
<p class="out" data-test="out">idle</p>
</main>
<script>
document.getElementById('pause').addEventListener('click', () => { document.querySelector('[data-test=out]').textContent = 'paused'; });
</script>
</body>
</html>
