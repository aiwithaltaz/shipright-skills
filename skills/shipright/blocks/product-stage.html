<!DOCTYPE html>
<html lang="en" data-interaction="click" data-expect="turned">
<!--
Block: product-stage
Job: One product object center stage. Drag or press Turn to rotate it. A contact shadow stays on the floor.
Use when: a public product hero and a glTF is not allowed
Do not use when: the brief asks for a premium or 3D site. Use product-3d.
Attributes: data-accent, data-label
Size: 5 KB
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keel on stage</title>
<style>

@import url("fonts/fonts.css");
  :root {
    --ink:#1c1916; --paper:#f7f6f3; --card:#fff; --line:#6f6a62; --accent:#145c3a; --muted:#4e4943;
    --space-1:4px; --space-2:8px; --space-3:16px; --space-4:24px; --space-5:32px; --space-6:40px; --space-7:48px; --space-8:64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; max-width: 100%; }
  body { font-family: "Inter", system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--paper); }
  a { color: inherit; text-decoration: none; }
  .mast { max-width: 960px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .mast b { font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 16px; }
  .mast span, .kicker { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  main { max-width: 960px; margin: 0 auto; padding: 48px 24px 64px; }
  h1, h2 { font-family: "Fraunces", Georgia, serif; font-weight: 400; line-height: 1.2; }
  h1 { font-size: 40px; margin: 8px 0 16px; }
  h2 { font-size: 24px; margin: 0 0 8px; }
  .kicker { margin: 0 0 8px; }
  p { margin: 8px 0 0; }
  [data-keep-text] { margin: 0 0 16px; max-width: 40em; color: var(--muted); }
  button, [role="option"] { font: inherit; color: inherit; }
  button { min-height: 44px; min-width: 44px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--ink); background: var(--card); cursor: pointer; }
  button[data-test="run"]:not(.row) { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .out { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
  @media (max-width: 800px) {
    main { padding: 32px 16px 48px; }
    h1 { font-size: 32px; }
    .mast { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }


    .stage { height: 320px; display: grid; place-items: center; position: relative; margin-top: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; }
    .shadow { position: absolute; bottom: 24px; width: 140px; height: 16px; background: #1c1916; opacity: .2; border-radius: 999px; filter: blur(2px); }
    .obj { width: min(180px, 60vw); height: 72px; background: var(--accent); border-radius: 12px; position: relative; transform: rotateX(58deg) rotateZ(var(--z, -18deg)); transition: transform 200ms cubic-bezier(.22,1,.36,1); }
    .obj::before { content: ""; position: absolute; left: 24px; right: 24px; top: -16px; height: 16px; background: #1c1916; border-radius: 8px; }
    .obj::after { content: ""; position: absolute; left: 16px; right: 16px; top: -24px; height: 8px; background: #c4b7a2; border-radius: 8px; }
    .still { display: none; }
    @media (prefers-reduced-motion: reduce) { .obj { transform: none; } .still { display: block; } }
    
</style>
</head>
<body>
<header class="mast"><b>Product stage</b><span>Demo data</span></header>
<main>
<p data-keep-text>The product stays visible with or without motion.</p>
<p class="kicker">Product stage</p>
<h1>Keel on stage</h1>
<div class="stage" data-accent="#145c3a">
      <div class="shadow"></div>
      <div class="obj" id="obj" data-label="stand-in"></div>
    </div>
    <p class="still">Still product. Motion is off.</p>
    <button type="button" data-test="run" id="turn">Turn</button>
<p class="out" data-test="out">idle</p>
</main>
<script>

    const obj = document.getElementById('obj');
    let z = -20;
    function setTurn(next) { z = next; obj.style.setProperty('--z', z + 'deg'); document.querySelector('[data-test=out]').textContent = 'turned'; }
    document.getElementById('turn').addEventListener('click', () => setTurn(z + 30));
    obj.addEventListener('pointerdown', e => { obj.setPointerCapture(e.pointerId); obj.dataset.x = e.clientX; });
    obj.addEventListener('pointermove', e => { if (e.buttons !== 1) return; setTurn(z + (e.clientX - Number(obj.dataset.x || e.clientX))); obj.dataset.x = e.clientX; });
    document.addEventListener('visibilitychange', () => { if (document.hidden) obj.style.transition = 'none'; });
    
</script>
</body>
</html>
