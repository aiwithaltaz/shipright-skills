<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Person details, before the system rule</title>
<style>
@font-face { font-family: "Inter"; font-weight: 400; src: url("file:///usr/share/fonts/truetype/macos/Inter-Regular.ttf") format("truetype"); }
@font-face { font-family: "Inter"; font-weight: 500; src: url("file:///usr/share/fonts/truetype/macos/Inter-Medium.ttf") format("truetype"); }
@font-face { font-family: "Inter"; font-weight: 600; src: url("file:///usr/share/fonts/truetype/macos/Inter-SemiBold.ttf") format("truetype"); }
@font-face { font-family: "Inter"; font-weight: 700; src: url("file:///usr/share/fonts/truetype/macos/Inter-Bold.ttf") format("truetype"); }
* { box-sizing: border-box; }
html, body { margin: 0; width: 390px; height: 844px; overflow: hidden; }
body { font-family: Inter, sans-serif; color: #1c1917; background: #f6f4fb; }
button, input { font-family: inherit; }
.screen { width: 390px; height: 844px; display: flex; flex-direction: column; }
.banner { padding: 28px 20px 36px; background: linear-gradient(160deg, #4c1d95, #c026d3 80%); color: #fff; }
.kicker { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.85; }
.banner h1 { margin: 0; font-size: 28px; line-height: 1.15; letter-spacing: -0.03em; }
.banner p { margin: 8px 0 0; font-size: 15px; line-height: 1.4; }
.badge { display: inline-block; margin-top: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.18); font-size: 12px; font-weight: 600; }
.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: -18px 16px 0; }
.metric { background: #fff; border-radius: 16px; padding: 12px 14px; box-shadow: 0 10px 24px rgba(76, 29, 149, 0.12); }
.metric b { display: block; font-size: 20px; color: #6d28d9; letter-spacing: -0.03em; }
.metric span { font-size: 12px; color: #6b6280; }
.card { margin: 12px 16px 0; background: #fff; border-radius: 18px; padding: 14px; box-shadow: 0 8px 20px rgba(76, 29, 149, 0.06); }
.card h2 { margin: 0 0 8px; font-size: 13px; color: #6b6280; font-weight: 600; }
.card input { width: 100%; height: 40px; border: 0; border-radius: 10px; background: #f4f0ff; margin-top: 8px; padding: 0 12px; font-size: 14px; }
.quote { margin: 12px 16px 0; background: #fff; border-radius: 18px; padding: 14px; font-size: 14px; line-height: 1.4; color: #3f3a4a; }
.quote span { display: block; margin-top: 6px; color: #6d28d9; font-weight: 600; font-size: 12px; }
.hintrow { margin: 12px 16px 0; display: flex; align-items: center; gap: 8px; color: #6b6280; font-size: 13px; }
.info { width: 28px; height: 28px; border-radius: 50%; border: 0; background: #ede9fe; color: #6d28d9; font-weight: 700; }
.dock { margin-top: auto; display: flex; gap: 8px; padding: 16px; }
.dock button { flex: 1; height: 48px; border: 0; border-radius: 14px; color: #fff; font-size: 15px; font-weight: 600; }
.save { background: #7c3aed; }
.go { background: #c026d3; }
</style>
</head>
<body>
<div class="screen">
  <header class="banner">
    <p class="kicker">Welcome back</p>
    <h1>Person details</h1>
    <p>Finish the profile, then explore more.</p>
    <span class="badge">Featured</span>
  </header>
  <div class="metrics">
    <div class="metric"><b>4.8</b><span>Average rating</span></div>
    <div class="metric"><b>128</b><span>Happy visitors</span></div>
  </div>
  <section class="card">
    <h2>About</h2>
    <input placeholder="First name" aria-label="First name">
    <input placeholder="Last name" aria-label="Last name">
  </section>
  <section class="card">
    <h2>Contact</h2>
    <input placeholder="Phone" aria-label="Phone">
  </section>
  <section class="card">
    <h2>Emergency</h2>
    <input placeholder="Contact name" aria-label="Emergency contact">
  </section>
  <p class="quote">"Smooth and easy from the first tap."<span>Sample quote</span></p>
  <p class="hintrow"><button class="info" title="Payment is still due">i</button> More info</p>
  <div class="dock">
    <button class="save">Save draft</button>
    <button class="go">Continue</button>
  </div>
</div>
</body>
</html>
