name: Source and context checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r evals/requirements-context.txt
      - run: python evals/check_sources.py --self-test
      - run: python evals/check_context.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: git diff --check
