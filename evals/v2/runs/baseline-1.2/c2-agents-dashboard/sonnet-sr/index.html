<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents | Agent Desk</title>
<meta name="description" content="Sample-data preview of an operator screen for a company with many AI agents: see which agents need a person, open one, act on it.">
<link rel="stylesheet" href="build/design/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: var(--topbar-height); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--color-bg); color: var(--color-text);
    font: var(--weight-regular) var(--text-body)/var(--leading-text) var(--font-sans);
    font-variant-numeric: tabular-nums;
  }
  h1, h2, h3, p { margin: 0; }
  button, input, select { font: inherit; color: inherit; }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: var(--focus-ring); outline-offset: var(--focus-offset); }

  .skip { position: absolute; left: var(--space-2); top: -48px; z-index: 50; background: var(--color-surface); color: var(--color-accent); padding: var(--space-2) var(--space-3); border: 1px solid var(--color-field-border); border-radius: var(--radius-control); }
  .skip:focus { top: var(--space-2); }

  /* Top bar */
  .topbar { height: var(--topbar-height); background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
  .topbar-in { max-width: var(--content-max); margin: 0 auto; height: 100%; padding: 0 var(--gutter); display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
  .brand { font-size: var(--text-section); font-weight: var(--weight-semibold); }
  .proto { font-size: var(--text-meta); color: var(--color-muted); text-align: right; }

  .page { max-width: var(--content-max); margin: 0 auto; padding: var(--space-6) var(--gutter) var(--space-10); }
  h1 { font-size: var(--text-title); line-height: var(--leading-heading); font-weight: var(--weight-semibold); }

  /* Controls */
  .controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-4); margin-top: var(--space-4); }
  .seg { margin: 0; padding: 0; border: 0; min-width: 0; }
  .seg-row { display: inline-flex; border: 1px solid var(--color-field-border); border-radius: var(--radius-control); background: var(--color-surface); overflow: hidden; }
  .seg-opt { position: relative; display: block; cursor: pointer; }
  .seg-opt + .seg-opt { border-left: 1px solid var(--color-field-border); }
  .seg-opt input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .seg-face { display: flex; align-items: center; gap: var(--space-2); height: calc(var(--control-height) - 2px); padding: 0 var(--space-3); white-space: nowrap; color: var(--color-text); }
  .seg-face .tick { display: none; color: var(--color-accent); }
  .seg-face .n { color: var(--color-muted); font-weight: var(--weight-regular); min-width: 1ch; }
  .seg-opt.is-on .seg-face { background: var(--color-accent-tint); font-weight: var(--weight-semibold); }
  .seg-opt.is-on .tick { display: block; }
  .seg-opt.is-on .n { color: var(--color-text); font-weight: var(--weight-semibold); }
  .seg-opt input:focus-visible + .seg-face { outline: var(--focus-ring); outline-offset: -2px; }
  .seg[disabled] .seg-opt, .seg[disabled] input { cursor: not-allowed; }
  .seg[disabled] .seg-face { color: var(--color-subtle); }

  .field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
  .field label { font-size: var(--text-caption); color: var(--color-muted); font-weight: var(--weight-medium); }
  .input-wrap { position: relative; }
  .input-wrap svg { position: absolute; left: var(--space-3); top: 50%; transform: translateY(-50%); color: var(--color-muted); pointer-events: none; }
  .input, .select { height: var(--control-height); border: 1px solid var(--color-field-border); border-radius: var(--radius-control); background: var(--color-surface); padding: 0 var(--space-3); width: 100%; }
  .input { padding-left: 36px; }
  .field.search { flex: 1 1 240px; max-width: 360px; }
  .field.team { flex: 0 1 200px; }
  .input::placeholder { color: var(--color-subtle); }
  .controls :disabled { background: var(--color-sunken); color: var(--color-subtle); cursor: not-allowed; }

  .count { margin-top: var(--space-4); font-size: var(--text-meta); color: var(--color-muted); min-height: 20px; }

  /* Table */
  .table-wrap { margin-top: var(--space-2); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-panel); }
  table.agents { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
  .agents th { position: sticky; top: 0; z-index: 2; background: var(--color-sunken); text-align: left; font-size: var(--text-meta); font-weight: var(--weight-semibold); color: var(--color-muted); padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--color-border); height: 36px; }
  .agents th:first-child { border-top-left-radius: var(--radius-panel); }
  .agents th:last-child { border-top-right-radius: var(--radius-panel); }
  .agents td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--color-border); vertical-align: top; min-height: var(--row-height); overflow-wrap: anywhere; }
  .agents tbody tr:last-child td { border-bottom: 0; }
  .agents tbody tr { cursor: pointer; }
  .agents tbody tr:hover td { background: var(--color-row-hover); }
  .agents tbody tr.is-open td { background: var(--color-accent-tint); }
  .agents .c-agent { width: 29%; } .agents .c-status { width: 17%; } .agents .c-work { width: 28%; } .agents .c-team { width: 13%; } .agents .c-time { width: 13%; text-align: right; white-space: nowrap; }
  .agents .c-time, .agents th.c-time { text-align: right; }
  .name { display: inline-block; padding: 2px 0; min-height: 24px; margin: 0; border: 0; background: none; text-align: left; font-weight: var(--weight-semibold); color: var(--color-accent); cursor: pointer; border-radius: var(--radius-sm); }
  .name:hover { text-decoration: underline; }
  .purpose { display: block; font-size: var(--text-meta); color: var(--color-muted); margin-top: 2px; }
  .c-meta-time { color: var(--color-muted); }
  .m-only { display: none; }

  /* Status chip */
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px 2px 6px; border-radius: var(--radius-sm); font-size: var(--text-meta); font-weight: var(--weight-semibold); white-space: nowrap; line-height: 1.4; }
  .chip-running { color: var(--color-success); background: var(--color-success-bg); }
  .chip-waiting { color: var(--color-warning); background: var(--color-warning-bg); }
  .chip-failed { color: var(--color-danger); background: var(--color-danger-bg); }
  .chip-paused, .chip-idle { color: var(--color-muted); background: var(--color-sunken); }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: var(--control-height); padding: 0 var(--space-4); border-radius: var(--radius-control); border: 1px solid var(--color-field-border); background: var(--color-surface); color: var(--color-text); font-weight: var(--weight-medium); cursor: pointer; transition: background-color var(--motion-press) var(--ease-move); white-space: nowrap; }
  .btn:hover { background: var(--color-sunken); }
  .btn-primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-text); }
  .btn-primary:hover { background: var(--color-accent-hover); border-color: var(--color-accent-hover); }
  .btn-danger { background: var(--color-danger); border-color: var(--color-danger); color: #fff; }
  .btn-danger:hover { background: var(--color-danger-hover); border-color: var(--color-danger-hover); }
  .btn[aria-disabled="true"] { opacity: .6; cursor: progress; }
  .btn.link { border: 0; background: none; padding: 0 var(--space-1); height: auto; color: var(--color-accent); text-decoration: underline; font-weight: var(--weight-medium); }

  /* Alerts and empty states */
  .alert { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-3) var(--space-4); border: 1px solid var(--color-danger); border-radius: var(--radius-panel); background: var(--color-danger-bg); color: var(--color-text); }
  .alert svg { color: var(--color-danger); margin-top: 3px; }
  .alert .alert-text { flex: 1; min-width: 0; }
  .alert-actions { margin-top: var(--space-2); }
  .empty { padding: var(--space-12) var(--space-4); text-align: center; color: var(--color-muted); }
  .empty strong { display: block; color: var(--color-text); font-size: var(--text-section); font-weight: var(--weight-semibold); margin-bottom: var(--space-1); }
  .empty .btn { margin-top: var(--space-3); }

  .agents tbody tr.skel { cursor: default; }
  .agents tbody tr.skel:hover td { background: none; }
  .skel td { height: 56px; }
  .skel span { display: block; height: 12px; border-radius: var(--radius-sm); background: var(--color-sunken); }
  .skel span.w1 { width: 60%; } .skel span.w2 { width: 40%; margin-top: 8px; } .skel span.w3 { width: 70%; } .skel span.w4 { width: 50%; }

  /* Prototype controls */
  .proto-bar { max-width: var(--content-max); margin: 0 auto; padding: var(--space-4) var(--gutter) var(--space-8); border-top: 1px dashed var(--color-border); display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; font-size: var(--text-meta); color: var(--color-muted); }
  .proto-bar select { height: var(--control-height-compact); border: 1px solid var(--color-field-border); border-radius: var(--radius-control); background: var(--color-surface); padding: 0 var(--space-3); }

  /* Drawer */
  .drawer { position: fixed; inset: 0 0 0 auto; margin: 0; padding: 0; width: min(var(--drawer-width), 100vw); max-width: none; height: 100dvh; max-height: none; border: 0; background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-float); border-radius: var(--radius-dialog) 0 0 var(--radius-dialog); overflow: hidden; }
  .drawer::backdrop { background: var(--color-scrim); }
  .drawer[open] { animation: sheet-in var(--motion-sheet) var(--ease-enter); }
  .drawer.closing { opacity: 0; transition: opacity 140ms var(--ease-move); }
  @keyframes sheet-in { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  .d-wrap { display: flex; flex-direction: column; height: 100%; }
  .d-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--color-border); }
  .d-head h2 { font-size: var(--text-section); line-height: var(--leading-heading); font-weight: var(--weight-semibold); overflow-wrap: anywhere; }
  .d-head .chip { margin-top: var(--space-2); }
  .d-body { flex: 1; overflow-y: auto; padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-5); }
  .d-foot { padding: var(--space-3) var(--space-5); border-top: 1px solid var(--color-border); display: flex; gap: var(--space-3); align-items: center; background: var(--color-surface); min-height: 60px; }
  .d-foot:empty { display: none; }
  .msg { display: none; }
  .msg.on { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: start; column-gap: var(--space-2); padding: var(--space-3); border-radius: var(--radius-panel); background: var(--color-success-bg); color: var(--color-text); border: 1px solid var(--color-success); }
  .msg svg { color: var(--color-success); margin-top: 3px; }
  .msg .btn.link { min-height: 24px; }
  dl.facts { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: var(--space-1) var(--space-4); font-size: var(--text-body); }
  dl.facts dt { color: var(--color-muted); } dl.facts dd { margin: 0; }
  .d-purpose { color: var(--color-text); }
  .block { border: 1px solid var(--color-border); border-radius: var(--radius-panel); padding: var(--space-4); background: var(--color-sunken); }
  .block.attn-waiting { border-color: var(--color-warning); background: var(--color-warning-bg); }
  .block.attn-failed { border-color: var(--color-danger); background: var(--color-danger-bg); }
  .block h3 { font-size: var(--text-body); font-weight: var(--weight-semibold); }
  .block p { margin-top: var(--space-1); }
  .block .muted { color: var(--color-muted); font-size: var(--text-meta); }
  .block .btns { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-3); }
  .runs h3 { font-size: var(--text-body); font-weight: var(--weight-semibold); margin-bottom: var(--space-2); }
  .runs ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--color-border); }
  .runs li { display: grid; grid-template-columns: 88px 1fr; gap: var(--space-1) var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--color-border); font-size: var(--text-body); }
  .runs .when { color: var(--color-muted); font-size: var(--text-meta); }
  .runs .out { font-weight: var(--weight-medium); }
  .runs .out.failed { color: var(--color-danger); }
  .runs .sum { color: var(--color-muted); font-size: var(--text-meta); grid-column: 2; }

  @media (max-width: 759px) {
    .topbar-in { gap: var(--space-2); }
    .proto { font-size: var(--text-caption); }
    .controls { flex-direction: column; align-items: stretch; gap: var(--space-3); }
    .seg-row { display: flex; width: 100%; }
    .seg-opt { flex: 1 1 0; min-width: 0; }
    .seg-face { justify-content: center; gap: 6px; padding: 0 var(--space-1); font-size: var(--text-meta); }
    .seg-face .tick { display: none !important; }
    .field.search, .field.team { flex: none; max-width: none; }
    .table-wrap { background: transparent; border: 0; }
    table.agents, .agents tbody, .agents tr, .agents td { display: block; }
    .agents thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .agents tbody { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-panel); }
    .agents tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-1) var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); }
    .agents tbody tr:last-child { border-bottom: 0; }
    .agents td { padding: 0; border: 0; width: auto !important; min-height: 0; }
    .agents tbody tr:hover td, .agents tbody tr.is-open td { background: none; }
    .agents tbody tr.is-open { background: var(--color-accent-tint); }
    .agents tbody tr:hover { background: var(--color-row-hover); }
    .agents .c-agent { grid-column: 1; grid-row: 1; }
    .agents .c-status { grid-column: 2; grid-row: 1; }
    .agents .c-work { grid-column: 1 / -1; grid-row: 2; }
    .agents .c-team { grid-column: 1; grid-row: 3; color: var(--color-muted); font-size: var(--text-meta); }
    .agents .c-time { grid-column: 2; grid-row: 3; font-size: var(--text-meta); color: var(--color-muted); text-align: right; }
    .name { min-height: 28px; }
    .skel { padding: var(--space-4) !important; }
    .skel td { height: auto; }
    .drawer { width: 100vw; border-radius: 0; }
    .d-head, .d-body, .d-foot { padding-left: var(--space-4); padding-right: var(--space-4); }
    .runs li { grid-template-columns: 76px 1fr; }
    .d-foot .btn, .block .btns .btn { flex: 1 1 auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .drawer[open] { animation: fade-in 1ms linear; }
    .drawer.closing { transition: none; }
    .btn { transition: none; }
    @keyframes fade-in { from { opacity: .99; } to { opacity: 1; } }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to agents</a>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9.5 16h-19z"/><path d="M12 10v4.5M12 17.5v.01"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></symbol>
    <symbol id="i-idle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="topbar-in">
    <span class="brand">Agent Desk</span>
    <span class="proto">Working name. Sample data.</span>
  </div>
</header>

<main id="main">
  <div class="page">
    <h1>Agents</h1>

    <div class="controls">
      <fieldset class="seg" id="seg">
        <legend class="sr">Show agents</legend>
        <div class="seg-row" id="segRow"></div>
      </fieldset>
      <div class="field search">
        <label for="q">Search agents</label>
        <div class="input-wrap">
          <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
          <input class="input" id="q" type="search" autocomplete="off" placeholder="Name or what it does">
        </div>
      </div>
      <div class="field team">
        <label for="team">Team</label>
        <select class="select" id="team"></select>
      </div>
    </div>

    <p class="count" id="count"></p>
    <p class="sr" id="live" role="status" aria-live="polite"></p>

    <div id="listArea"></div>
  </div>
</main>

<div class="proto-bar">
  <label for="uiState"><strong>Prototype only.</strong> Preview a state:</label>
  <select id="uiState">
    <option value="populated">Agents loaded</option>
    <option value="loading">Loading agents</option>
    <option value="empty">No agents yet</option>
    <option value="error">Agents did not load</option>
    <option value="runs-error">Recent runs did not load (open an agent)</option>
  </select>
  <span>Actions change this page only. Nothing is saved.</span>
</div>

<dialog class="drawer" id="drawer" aria-labelledby="dTitle">
  <div class="d-wrap">
    <header class="d-head">
      <div>
        <h2 id="dTitle"></h2>
        <div id="dChip"></div>
      </div>
      <button type="button" class="btn" id="dClose"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg>Close</button>
    </header>
    <div class="d-body" id="dBody">
      <div class="msg" id="dMsg" role="status"></div>
      <div id="dMain"></div>
    </div>
    <footer class="d-foot" id="dFoot"></footer>
  </div>
</dialog>

    ['code-review', 'Code Review Agent', 'Reviews pull requests for style and bugs', 'Engineering', 'running', 'Reviewing 5 pull requests', 1, 'pull requests'],
    ['incident-sum', 'Incident Summarizer', 'Writes summaries after incidents close', 'Engineering', 'idle', 'No work queued', 720, 'incidents'],
    ['dep-update', 'Dependency Update Agent', 'Opens pull requests for package updates', 'Engineering', 'running', 'Updating 4 packages', 15, 'packages'],
    ['test-triage', 'Test Triage Agent', 'Sorts failing tests by likely cause', 'Engineering', 'failed', 'Test results queue is unreachable', 33, 'test runs'],
    ['resume-screen', 'Resume Screener', 'Ranks applications against the job brief', 'People', 'running', 'Screening 17 applications', 5, 'applications'],
    ['onboarding', 'Onboarding Checklist Agent', 'Tracks new-hire tasks', 'People', 'idle', 'No work queued', 1440, 'tasks'],
    ['policy-qa', 'Policy Q&A Agent', 'Answers staff questions from policy documents', 'People', 'running', 'Answering 4 questions', 0, 'questions'],
    ['vendor-onboard', 'Vendor Onboarding Agent', 'Collects documents from new vendors', 'Operations', 'waiting', 'Asks to approve 2 new vendors', 210, 'vendors'],
    ['inventory', 'Inventory Reconciler', 'Compares stock counts with the system', 'Operations', 'running', 'Reconciling 3 warehouses', 7, 'counts'],
    ['shipment', 'Shipment Tracker', 'Watches carrier updates', 'Operations', 'running', 'Tracking 58 shipments', 1, 'shipments']
  ];
  var REQUESTS = {
    'payment-reminders': ['Send 14 payment reminders', 'These invoices are more than 30 days overdue. The drafts are ready. Nothing is sent until you approve.'],
    'refund-request': ['Approve a refund above the agent’s limit', 'A customer asked for a refund larger than this agent may approve alone.'],
    'outreach': ['Send 25 first-contact emails', 'The drafts are written. Nothing is sent until you approve.'],
    'nda-intake': ['Send 1 NDA for signature', 'The counterparty’s name came from an email signature, not a form. Check it before you approve.'],
    'vendor-onboard': ['Approve 2 new vendors', 'Both vendors have sent every document the agent asks for.']
  };
  var FAILURES = {
    'ledger-export': 'The export timed out after 3 attempts. The ledger service did not answer.',
    'escalation-router': 'The agent could not reach the helpdesk, so urgent tickets are not being routed.',
    'quote-builder': 'The price list file was not found, so no quotes can be built.',
    'test-triage': 'The test results queue is unreachable, so failing tests are not being sorted.'
  };

  var agents = RAW.map(function (r, i) {
    var a = { id: r[0], name: r[1], purpose: r[2], team: r[3], status: r[4], detail: r[5], mins: r[6], unit: r[7], pausedFrom: r[8] || null, idx: i };
    if (REQUESTS[a.id]) a.request = { summary: REQUESTS[a.id][0], detail: REQUESTS[a.id][1] };
    if (FAILURES[a.id]) a.failure = FAILURES[a.id];
    return a;
  });
  var byId = {}; agents.forEach(function (a) { byId[a.id] = a; });
  var teams = Array.from(new Set(agents.map(function (a) { return a.team; }))).sort();

  function runsFor(a) {
    var offs = [0, 95, 240, 1380], out = [], i;
    for (i = 0; i < 4; i++) {
      var n = 6 + ((a.idx * 7 + i * 13) % 40);
      var r = { mins: a.mins + offs[i] + (a.idx % 5) * 3, outcome: 'Completed', sum: 'Handled ' + n + ' ' + a.unit };
      out.push(r);
    }
    if (a.status === 'failed') { out[0].outcome = 'Failed'; out[0].sum = a.failure ? a.failure.split('. ')[0].replace(/\.$/, '') : 'Run failed'; }
    else if (a.status === 'running') { out[0].outcome = 'Running'; out[0].sum = a.detail; }
    else if (a.status === 'waiting') { out[0].outcome = 'Waiting for you'; out[0].sum = a.detail; }
    return out;
  }

  /* ---------- State ---------- */
  var state = { view: 'attn', q: '', team: '', ui: 'populated', openId: null, confirm: false, busy: null, msg: null, runsRetried: false, pushed: false, lastFocus: null };
  var attnCount = agents.filter(function (a) { return ATTN[a.status]; }).length;
  state.view = attnCount > 0 ? 'attn' : 'all';

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function icon(id) { return '<svg class="i" aria-hidden="true"><use href="#' + id + '"/></svg>'; }
  function ago(m) {
    if (m < 1) return 'Just now';
    if (m < 60) return m + ' min ago';
    if (m < 1440) return Math.round(m / 60) + ' h ago';
    return Math.floor(m / 1440) + ' d ago';
  }
  function chip(st) { return '<span class="chip chip-' + st + '">' + icon(ICON[st]) + S[st] + '</span>'; }
  function lower1(s) { return s.charAt(0).toLowerCase() + s.slice(1); }

  /* ---------- Filtering ---------- */
  function matchesBase(a) {
    if (state.team && a.team !== state.team) return false;
    var q = state.q.trim().toLowerCase();
    if (q && (a.name + ' ' + a.purpose).toLowerCase().indexOf(q) === -1) return false;
    return true;
  }
  function inView(a, v) {
    if (v === 'attn') return !!ATTN[a.status];
    if (v === 'running') return a.status === 'running';
    return true;
  }
  function sorted(list) {
    return list.slice().sort(function (x, y) { return RANK[x.status] - RANK[y.status] || x.mins - y.mins || x.idx - y.idx; });
  }
  function visible() { return sorted(agents.filter(function (a) { return matchesBase(a) && inView(a, state.view); })); }

  /* ---------- Controls ---------- */
  var VIEWS = [['attn', 'Needs attention'], ['running', 'Running'], ['all', 'All']];
  function renderSeg() {
    var enabled = state.ui === 'populated' || state.ui === 'empty' || state.ui === 'runs-error';
    var known = enabled;
    $('seg').disabled = !enabled;
    $('q').disabled = !enabled; $('team').disabled = !enabled;
    $('segRow').innerHTML = VIEWS.map(function (v) {
      var n = known ? agents.filter(function (a) { return state.ui !== 'empty' && matchesBase(a) && inView(a, v[0]); }).length : '';
      return '<label class="seg-opt' + (state.view === v[0] ? ' is-on' : '') + '"><input type="radio" name="view" value="' + v[0] + '"' + (state.view === v[0] ? ' checked' : '') + (enabled ? '' : ' disabled') + '>' +
        '<span class="seg-face">' + icon('i-check').replace('class="i"', 'class="i tick"') + '<span>' + v[1] + '</span><span class="n">' + (known ? n : '') + '</span></span></label>';
    }).join('');
  }
  function renderTeams() {
    $('team').innerHTML = '<option value="">All teams</option>' + teams.map(function (t) { return '<option value="' + esc(t) + '"' + (state.team === t ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('');
  }

  /* ---------- List ---------- */
  function renderList() {
    var area = $('listArea'), html = '', rows;
    var count = $('count');
    if (state.ui === 'loading') {
      count.textContent = '';
      var sk = '';
      for (var i = 0; i < 8; i++) sk += '<tr class="skel"><td class="c-agent"><span class="w1"></span><span class="w2"></span></td><td class="c-status"><span class="w4"></span></td><td class="c-work"><span class="w3"></span></td><td class="c-team"><span class="w4"></span></td><td class="c-time"><span class="w4"></span></td></tr>';
      area.innerHTML = '<div class="table-wrap" aria-busy="true"><p class="sr">Loading agents</p><table class="agents">' + head() + '<tbody>' + sk + '</tbody></table></div>';
      return;
    }
    if (state.ui === 'error') {
      count.textContent = '';
      area.innerHTML = '<div class="alert" role="alert">' + icon('i-alert') + '<div class="alert-text"><strong>Agents did not load.</strong> Check your connection and try again.<div class="alert-actions"><button type="button" class="btn" data-act="reload">Try again</button></div></div></div>';
      return;
    }
    if (state.ui === 'empty') {
      count.textContent = '';
      area.innerHTML = '<div class="table-wrap"><div class="empty"><strong>No agents yet</strong>Agents appear here once they are connected to Agent Desk.</div></div>';
      return;
    }
    rows = visible();
    count.textContent = rows.length === agents.length ? agents.length + ' agents' : 'Showing ' + rows.length + ' of ' + agents.length + ' agents';
    if (!rows.length) {
      var filtered = state.q.trim() || state.team;
      if (!filtered && state.view === 'attn') {
        html = '<div class="empty"><strong>Nothing needs you right now</strong>Every agent is running, idle or paused.<br><button type="button" class="btn" data-act="show-all">Show all agents</button></div>';
      } else if (filtered) {
        html = '<div class="empty"><strong>No agents match your search</strong>Try a different name or team.<br><button type="button" class="btn" data-act="clear-filters">Clear search and team</button></div>';
      } else {
        html = '<div class="empty"><strong>No agents in this view</strong><button type="button" class="btn" data-act="show-all">Show all agents</button></div>';
      }
      area.innerHTML = '<div class="table-wrap">' + html + '</div>';
      return;
    }
    var body = rows.map(function (a) {
      return '<tr data-id="' + a.id + '"' + (state.openId === a.id ? ' class="is-open"' : '') + '>' +
        '<td class="c-agent"><button type="button" class="name" data-agent="' + a.id + '" aria-haspopup="dialog">' + esc(a.name) + '</button><span class="purpose">' + esc(a.purpose) + '</span></td>' +
        '<td class="c-status">' + chip(a.status) + '</td>' +
        '<td class="c-work">' + esc(a.detail) + '</td>' +
        '<td class="c-team">' + esc(a.team) + '</td>' +
        '<td class="c-time">' + ago(a.mins) + '</td></tr>';
    }).join('');
    area.innerHTML = '<div class="table-wrap"><table class="agents">' + head() + '<tbody>' + body + '</tbody></table></div>';
  }
  function head() {
    return '<caption class="sr">Agents, most urgent first</caption><thead><tr><th scope="col" class="c-agent">Agent</th><th scope="col" class="c-status">Status</th><th scope="col" class="c-work">Current work</th><th scope="col" class="c-team">Team</th><th scope="col" class="c-time">Last active</th></tr></thead>';
  }
  function renderAll() { renderSeg(); renderList(); }

  var liveTimer;
  function announceCount() {
    clearTimeout(liveTimer);
    liveTimer = setTimeout(function () {
      if (state.ui !== 'populated' && state.ui !== 'runs-error') return;
      var n = visible().length;
      $('live').textContent = n === 0 ? 'No agents match.' : n + (n === 1 ? ' agent shown' : ' agents shown');
    }, 400);
  }

  /* ---------- Drawer ---------- */
  var dlg = $('drawer');

  function renderDrawer() {
    var a = byId[state.openId], main = $('dMain'), foot = $('dFoot');
    var msg = $('dMsg');
    if (state.msg) {
      msg.className = 'msg on';
      msg.innerHTML = icon('i-check') + '<span>' + esc(state.msg.text) + '</span>' + (state.msg.undo ? '<button type="button" class="btn link" data-act="undo">Undo</button>' : '<span></span>') + '<button type="button" class="btn link" data-act="dismiss-msg">Dismiss</button>';
    } else { msg.className = 'msg'; msg.innerHTML = ''; }

    if (!a) {
      $('dTitle').textContent = 'Agent not found';
      $('dChip').innerHTML = '';
      main.innerHTML = '<p>That agent was not found. It may have been removed.</p>';
      foot.innerHTML = '';
      return;
    }
    $('dTitle').textContent = a.name;
    $('dChip').innerHTML = chip(a.status);

    var busy = state.busy;
    var block = '';
    if (a.status === 'waiting' && a.request) {
      if (state.confirm) {
        block = '<section class="block attn-waiting" aria-labelledby="blk"><h3 id="blk">Decline this request?</h3>' +
          '<p>' + esc(a.name) + ' will not ' + esc(lower1(a.request.summary)) + ' and its current run ends.</p>' +
          '<div class="btns"><button type="button" class="btn btn-danger" data-act="decline-confirm"' + (busy === 'decline' ? ' aria-disabled="true"' : '') + '>' + (busy === 'decline' ? 'Declining...' : 'Decline request') + '</button>' +
          '<button type="button" class="btn" data-act="decline-cancel">Cancel</button></div></section>';
      } else {
        block = '<section class="block attn-waiting" aria-labelledby="blk"><h3 id="blk">Waiting for you: ' + esc(a.request.summary) + '</h3>' +
          '<p>' + esc(a.request.detail) + '</p><p class="muted">Asked ' + ago(a.mins) + '.</p>' +
          '<div class="btns"><button type="button" class="btn btn-primary" data-act="approve"' + (busy ? ' aria-disabled="true"' : '') + '>' + (busy === 'approve' ? 'Approving...' : 'Approve') + '</button>' +
          '<button type="button" class="btn" data-act="decline"' + (busy ? ' aria-disabled="true"' : '') + '>Decline</button></div></section>';
      }
    } else if (a.status === 'failed') {
      block = '<section class="block attn-failed" aria-labelledby="blk"><h3 id="blk">Last run failed</h3>' +
        '<p>' + esc(a.failure || 'The run did not finish.') + '</p><p class="muted">Failed ' + ago(a.mins) + '.</p>' +
        '<div class="btns"><button type="button" class="btn btn-primary" data-act="retry"' + (busy ? ' aria-disabled="true"' : '') + '>' + (busy === 'retry' ? 'Retrying...' : 'Retry run') + '</button></div></section>';
    }

    var runs;
    if (state.ui === 'runs-error' && !state.runsRetried) {
      runs = '<div class="alert" role="alert">' + icon('i-alert') + '<div class="alert-text">Recent runs did not load.<div class="alert-actions"><button type="button" class="btn" data-act="runs-retry">Try again</button></div></div></div>';
    } else {
      runs = '<ul>' + runsFor(a).map(function (r) {
        return '<li><span class="when">' + ago(r.mins) + '</span><span class="out' + (r.outcome === 'Failed' ? ' failed' : '') + '">' + esc(r.outcome) + '</span><span class="sum">' + esc(r.sum) + '</span></li>';
      }).join('') + '</ul>';
    }

    main.innerHTML =
      '<div style="display:flex;flex-direction:column;gap:var(--space-5)">' +
      '<p class="d-purpose">' + esc(a.purpose) + '.</p>' +
      block +
      '<dl class="facts"><dt>Team</dt><dd>' + esc(a.team) + '</dd>' + (block ? '' : '<dt>Current work</dt><dd>' + esc(a.detail) + '</dd>') + '<dt>Last active</dt><dd>' + ago(a.mins) + '</dd></dl>' +
      '<section class="runs" aria-labelledby="rn"><h3 id="rn">Recent runs</h3>' + runs + '</section></div>';

    if (a.status === 'paused') {
      foot.innerHTML = '<button type="button" class="btn" data-act="resume"' + (busy ? ' aria-disabled="true"' : '') + '>' + (busy === 'resume' ? 'Resuming...' : 'Resume agent') + '</button>';
    } else if (a.status === 'waiting') {
      foot.innerHTML = '';
    } else {
      foot.innerHTML = '<button type="button" class="btn" data-act="pause"' + (busy ? ' aria-disabled="true"' : '') + '>' + (busy === 'pause' ? 'Pausing...' : 'Pause agent') + '</button>';
    }
  }

  function url(withAgent) {
    var p = new URLSearchParams();
    if (state.view !== (attnCount ? 'attn' : 'all')) p.set('view', state.view);
    if (state.q.trim()) p.set('q', state.q.trim());
    if (state.team) p.set('team', state.team);
    if (withAgent && state.openId) p.set('agent', state.openId);
    var s = p.toString();
    return location.pathname + (s ? '?' + s : '');
  }
  function syncUrl() { try { history.replaceState(history.state, '', url(!!state.openId)); } catch (e) {} }

  function openAgent(id, opts) {
    opts = opts || {};
    state.openId = id; state.confirm = false; state.busy = null; state.msg = null; state.runsRetried = false;
    state.lastFocus = opts.from || null;
    renderDrawer();
    $('dBody').scrollTop = 0;
    dlg.classList.remove('closing');
    if (!dlg.open) dlg.showModal();
    if (opts.push !== false) {
      try { history.pushState({ agent: id }, '', url(true)); state.pushed = true; } catch (e) {}
    }
    renderList();
  }

  function closeAgent(fromPop) {
    if (!dlg.open) return;
    var id = state.openId, a = byId[id];
    var finish = function () {
      dlg.classList.remove('closing');
      dlg.close();
      state.openId = null; state.confirm = false; state.busy = null;
      if (!fromPop) {
        if (state.pushed) { state.pushed = false; try { history.back(); } catch (e) {} }
        else syncUrl();
      } else { state.pushed = false; }
      renderAll();
      var btn = id && document.querySelector('[data-agent="' + id + '"]');
      if (btn) btn.focus();
      else {
        var checked = document.querySelector('input[name="view"]:checked');
        if (checked && !checked.disabled) checked.focus(); else $('main').focus();
        if (a) $('live').textContent = a.name + ' is now ' + S[a.status] + ' and is not in this view.';
      }
    };
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) finish();
    else { dlg.classList.add('closing'); setTimeout(finish, 140); }
  }

  dlg.addEventListener('cancel', function (e) { e.preventDefault(); closeAgent(false); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) closeAgent(false); });
  $('dClose').addEventListener('click', function () { closeAgent(false); });
  window.addEventListener('popstate', function () {
    var id = new URLSearchParams(location.search).get('agent');
    if (id && !dlg.open) openAgent(id, { push: false });
    else if (!id && dlg.open) closeAgent(true);
  });

  /* ---------- Actions ---------- */
  function say(text, undo) { state.msg = { text: text, undo: undo || null }; }
  function focusAfterAction() {
    var f = $('dMsg').querySelector('[data-act="undo"]');
    (f || $('dClose')).focus();
  }
  function run(kind, actName, apply) {
    if (state.busy) return;
    state.busy = kind; state.msg = null; renderDrawer();
    var cur = dlg.querySelector('[data-act="' + actName + '"]'); if (cur) cur.focus();
    setTimeout(function () {
      var a = byId[state.openId];
      state.busy = null; state.confirm = false;
      apply(a);
      renderDrawer(); renderAll(); focusAfterAction();
    }, 450);
  }
  function setStatus(a, st, detail) { a.status = st; a.detail = detail; a.mins = 0; }

  function act(kind) {
    var a = byId[state.openId]; if (!a) return;
    if (state.busy) return;
    if (kind === 'decline') { state.confirm = true; renderDrawer(); var c = $('dMain').querySelector('[data-act="decline-cancel"]'); if (c) c.focus(); return; }
    if (kind === 'decline-cancel') { state.confirm = false; renderDrawer(); var d = $('dMain').querySelector('[data-act="decline"]'); if (d) d.focus(); return; }
    if (kind === 'dismiss-msg') { state.msg = null; renderDrawer(); $('dClose').focus(); return; }
    if (kind === 'runs-retry') { state.runsRetried = true; renderDrawer(); return; }
    if (kind === 'approve') run('approve', 'approve', function (x) { setStatus(x, 'running', 'Approved: ' + lower1(x.request.summary)); x.request = null; say('Approved. ' + x.name + ' is running.'); });
    if (kind === 'decline-confirm') run('decline', 'decline-confirm', function (x) { var s = x.request.summary; x.request = null; setStatus(x, 'idle', 'Declined by you: ' + lower1(s)); say('Declined. ' + x.name + ' ended its current run.'); });
    if (kind === 'retry') run('retry', 'retry', function (x) { setStatus(x, 'running', 'Retrying after the failed run'); x.failure = null; say('Retry started for ' + x.name + '.'); });
    if (kind === 'pause') run('pause', 'pause', function (x) {
      x.snapshot = { status: x.status, detail: x.detail, mins: x.mins, failure: x.failure || null };
      x.pausedFrom = x.status; setStatus(x, 'paused', 'Paused'); say(x.name + ' is paused.', true);
    });
    if (kind === 'undo') run('undo', 'undo', function (x) {
      if (x.snapshot) { x.status = x.snapshot.status; x.detail = x.snapshot.detail; x.mins = x.snapshot.mins; x.failure = x.snapshot.failure; x.snapshot = null; }
      x.pausedFrom = null; say('Pause undone. ' + x.name + ' is ' + S[x.status] + '.');
    });
    if (kind === 'resume') run('resume', 'resume', function (x) {
      var back = x.pausedFrom && x.pausedFrom !== 'paused' ? x.pausedFrom : 'idle';
      if (back === 'running') setStatus(x, 'running', 'Picking up queued work');
      else setStatus(x, 'idle', 'No work queued');
      x.pausedFrom = null; say(x.name + ' resumed and is ' + S[x.status] + '.');
    });
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (t) {
      if (t.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
      var k = t.getAttribute('data-act');
      if (k === 'reload') { setUi('populated'); return; }
      if (k === 'show-all') { state.view = 'all'; syncUrl(); renderAll(); return; }
      if (k === 'clear-filters') { state.q = ''; state.team = ''; $('q').value = ''; renderTeams(); syncUrl(); renderAll(); announceCount(); return; }
      act(k); return;
    }
    var n = e.target.closest('[data-agent]');
    if (n) { openAgent(n.getAttribute('data-agent'), { from: n }); return; }
    var row = e.target.closest('tr[data-id]');
    if (row && !e.target.closest('button')) openAgent(row.getAttribute('data-id'), { from: row.querySelector('.name') });
  });
  $('segRow').addEventListener('change', function (e) {
    if (e.target.name === 'view') { state.view = e.target.value; syncUrl(); renderAll(); var c = document.querySelector('input[name="view"]:checked'); if (c) c.focus(); announceCount(); }
  });
  $('q').addEventListener('input', function (e) { state.q = e.target.value; syncUrl(); renderAll(); announceCount(); });
  $('team').addEventListener('change', function (e) { state.team = e.target.value; syncUrl(); renderAll(); announceCount(); });

  function setUi(v) {
    state.ui = v; $('uiState').value = v;
    if (dlg.open && v !== 'runs-error' && v !== 'populated') closeAgent(false);
    state.runsRetried = false;
    renderAll();
    if (dlg.open) renderDrawer();
  }
  $('uiState').addEventListener('change', function (e) { setUi(e.target.value); });
  $('main').setAttribute('tabindex', '-1');

  /* ---------- Start ---------- */
  var params = new URLSearchParams(location.search);
  if (['attn', 'running', 'all'].indexOf(params.get('view')) > -1) state.view = params.get('view');
  if (params.get('q')) { state.q = params.get('q'); $('q').value = state.q; }
  if (teams.indexOf(params.get('team')) > -1) state.team = params.get('team');
  renderTeams();
  renderAll();
  if (params.get('agent')) openAgent(params.get('agent'), { push: false });
})();
</script>
</body>
</html>
