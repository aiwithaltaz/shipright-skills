<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule, Crewline (working name)</title>
<meta name="description" content="Preview of the crew schedule and invoices screens for small landscaping companies. Sample data only.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231C6A45'/%3E%3Cpath d='M4 8.5l2.5 2.5L12 5.5' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="design/tokens.css">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--color-bg);color:var(--color-text);font:var(--text-body)/var(--leading-text) var(--font-sans);min-height:100vh}
h1,h2,h3,p,dl,dd,ul{margin:0;padding:0}
ul{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* Focus */
:where(a,button,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}

/* Skip link */
.skip{position:absolute;left:var(--space-4);top:-48px;background:var(--color-surface);border:1px solid var(--color-field-border);padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);z-index:50;color:var(--color-text)}
.skip:focus{top:var(--space-2)}

/* Top bar */
.topbar{position:sticky;top:0;z-index:10;height:56px;background:var(--color-surface);border-bottom:1px solid var(--color-border)}
.topbar-in{max-width:var(--content-max);margin:0 auto;height:100%;padding:0 var(--gutter);display:flex;align-items:center;gap:var(--space-6)}
.brand{font-weight:600;font-size:var(--text-section);letter-spacing:-.01em;white-space:nowrap}
.brand small{font-weight:400;font-size:var(--text-caption);color:var(--color-muted);margin-left:var(--space-2)}
.nav{display:flex;gap:var(--space-1)}
.nav a{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--control-h);padding:0 var(--space-3);border-radius:var(--radius-md);color:var(--color-muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--color-sunken);color:var(--color-text)}
.nav a[aria-current="page"]{background:var(--color-sunken);color:var(--color-text);font-weight:600}
.nav .count{font-size:var(--text-caption);font-weight:400;color:var(--color-muted)}
.company{margin-left:auto;color:var(--color-muted);font-size:var(--text-meta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* Page */
.page{max-width:var(--content-max);margin:0 auto;padding:var(--space-6) var(--gutter) var(--space-10)}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-4)}
h1{font-size:var(--text-page);line-height:var(--leading-heading);font-weight:600;letter-spacing:-.01em}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);height:var(--control-h);padding:0 var(--space-3);border-radius:var(--radius-md);border:1px solid var(--color-field-border);background:var(--color-surface);color:var(--color-text);font-weight:500;cursor:pointer;white-space:nowrap;transition:background var(--motion-fast) var(--ease-out)}
.btn:hover{background:var(--color-sunken)}
.btn.primary{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-accent-contrast)}
.btn.primary:hover{background:#17583A;border-color:#17583A}
.btn.text{border-color:transparent;background:transparent;padding:0 var(--space-2);color:var(--color-accent);font-weight:600}
.btn.text:hover{background:var(--color-accent-tint)}
.btn.danger-text{border-color:transparent;background:transparent;color:var(--color-danger);padding:0 var(--space-2);font-weight:600}
.btn.danger-text:hover{background:var(--color-danger-bg)}
.btn.danger{background:var(--color-danger);border-color:var(--color-danger);color:#fff}
.btn.danger:hover{background:#A52B19}
.btn[disabled],.btn[aria-disabled="true"]{opacity:1;color:var(--color-muted);background:var(--color-sunken);border-color:var(--color-border);cursor:not-allowed}
.btn.primary[disabled]{background:var(--color-sunken);color:var(--color-muted);border-color:var(--color-border)}
.link-btn{background:none;border:0;padding:0;color:var(--color-accent);text-decoration:underline;font-weight:600;cursor:pointer;text-underline-offset:2px}

/* Toolbar and summary */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-3);margin-bottom:var(--space-2)}
.toolbar .range{font-size:var(--text-section);font-weight:600;margin-left:var(--space-2);font-variant-numeric:tabular-nums}
.btn-group{display:inline-flex;flex-wrap:wrap;gap:var(--space-2);max-width:100%}
.summary{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4);color:var(--color-muted);font-size:var(--text-meta);margin-bottom:var(--space-4);min-height:20px}
.summary .warn{color:var(--color-warning);font-weight:500;display:inline-flex;align-items:center;gap:var(--space-1)}

/* Board */
.board-wrap{display:block}
.board{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg)}
.board th,.board td{border-right:1px solid var(--color-border);border-bottom:1px solid var(--color-border);vertical-align:top;text-align:left;font-weight:400}
.board th:last-child,.board td:last-child{border-right:0}
.board tbody tr:last-child>*{border-bottom:0}
.board thead th{position:sticky;top:56px;z-index:3;background:var(--color-surface);padding:var(--space-2) var(--space-3);height:44px;vertical-align:middle;font-size:var(--text-meta);font-weight:600;border-top-left-radius:0}
.board thead th:first-child{border-top-left-radius:var(--radius-lg);width:var(--crew-col);color:var(--color-muted);font-weight:500}
.board thead th:last-child{border-top-right-radius:var(--radius-lg)}
.board thead th.today{background:var(--color-accent-tint)}
.board .tag-today{margin-left:var(--space-1);font-weight:600;color:var(--color-accent);font-size:var(--text-caption)}
.board tbody th{padding:var(--space-3);width:var(--crew-col);background:var(--color-surface)}
.crew-name{display:block;font-weight:600;font-size:var(--text-body)}
.crew-members{display:block;color:var(--color-muted);font-size:var(--text-caption);margin-top:2px}
.board tr.needs th,.board tr.needs td{background:var(--color-sunken)}
.board tr.needs th .crew-name{display:flex;gap:var(--space-1);align-items:center;color:var(--color-warning)}
.board td{padding:var(--space-2)}
.cell{display:flex;flex-direction:column;gap:6px;min-width:0}
.cell:empty::after{content:"";display:block;min-height:24px}

/* Job item */
.job{display:block;width:100%;min-width:0;text-align:left;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-2);cursor:pointer;transition:background var(--motion-fast) var(--ease-out)}
.job:hover{background:var(--color-sunken)}
.job span{display:block;min-width:0;overflow-wrap:anywhere}
.job-time{font-size:var(--text-caption);color:var(--color-muted);font-variant-numeric:tabular-nums}
.job-name{font-weight:600;font-size:var(--text-meta);line-height:1.3;margin-top:1px}
.job-svc{font-size:var(--text-caption);color:var(--color-muted);margin-top:2px;line-height:1.35}
.job-status{display:flex!important;align-items:flex-start;gap:var(--space-1);font-size:var(--text-caption);margin-top:6px;line-height:1.3;color:var(--color-muted)}
.job-status svg{margin-top:1px;width:14px;height:14px}
.job-status.warn{color:var(--color-warning);font-weight:600}
.load{font-size:var(--text-caption);color:var(--color-muted);font-variant-numeric:tabular-nums;padding:2px var(--space-1) 0;display:flex;gap:var(--space-1);align-items:flex-start}
.load.over{color:var(--color-warning);font-weight:600;background:var(--color-warning-bg);border-radius:var(--radius-sm);padding:var(--space-1)}
.load.over svg{margin-top:1px;width:14px;height:14px}

/* Skeleton */
.skel{background:var(--color-sunken);border-radius:var(--radius-md);height:56px}
.skel.s{height:36px}

/* Alert and empty */
.alert{display:flex;gap:var(--space-3);align-items:center;padding:var(--space-3) var(--space-4);border-radius:var(--radius-lg);background:var(--color-danger-bg);color:var(--color-danger);border:1px solid #E9B8AE;font-weight:500}
.alert .alert-body{flex:1;min-width:0}
.alert.warn{background:var(--color-warning-bg);color:var(--color-warning);border-color:#EBCB9F}
.alert .btn{background:var(--color-surface)}
.empty{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-10) var(--space-6);text-align:center;color:var(--color-muted)}
.empty strong{display:block;color:var(--color-text);font-size:var(--text-section);font-weight:600;margin-bottom:var(--space-1)}
.empty .btn{margin-top:var(--space-4)}

/* Day view (narrow) */
.dayview{display:none}
.chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--space-1);margin-bottom:var(--space-4)}
.chip{min-height:var(--control-h-touch);padding:var(--space-1) 0;border-radius:var(--radius-md);border:1px solid var(--color-field-border);background:var(--color-surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;position:relative}
.chip .d{font-size:var(--text-caption);color:var(--color-muted)}
.chip .n{font-weight:600;font-variant-numeric:tabular-nums}
.chip .c{font-size:11px;color:var(--color-muted)}
.chip[aria-pressed="true"]{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
.chip[aria-pressed="true"] .d,.chip[aria-pressed="true"] .c{color:#fff}
.chip svg{position:absolute;top:3px;right:3px;width:12px;height:12px;stroke-width:2}
.chip .tdy{font-size:11px;font-weight:600;color:var(--color-accent)}
.chip[aria-pressed="true"] .tdy{color:#fff}
.day-title{font-size:var(--text-section);font-weight:600;margin-bottom:var(--space-3)}
.crew-sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:var(--space-4);align-items:start}
.crew-sec{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-3)}
.crew-sec h3{font-size:var(--text-body);font-weight:600}
.crew-sec .sub{color:var(--color-muted);font-size:var(--text-caption);margin-bottom:var(--space-3)}
.crew-sec.needs{background:var(--color-sunken)}
.crew-sec .none{color:var(--color-muted);font-size:var(--text-meta)}
.crew-sec .cell{gap:var(--space-2)}
.bottombar{display:none}

/* Invoices */
.seg{display:inline-flex;gap:2px;background:var(--color-sunken);padding:2px;border-radius:var(--radius-md);margin-bottom:var(--space-3);max-width:100%;flex-wrap:wrap}
.seg button{height:32px;padding:0 var(--space-3);border:0;background:transparent;border-radius:4px;cursor:pointer;font-weight:500;color:var(--color-muted);display:inline-flex;gap:var(--space-2);align-items:center}
.seg button:hover{color:var(--color-text)}
.seg button[aria-pressed="true"]{background:var(--color-surface);color:var(--color-text);font-weight:600;box-shadow:0 0 0 1px var(--color-border)}
.seg button[aria-pressed="true"] svg{color:var(--color-accent)}
.inv{width:100%;border-collapse:separate;border-spacing:0;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg)}
.inv th,.inv td{padding:0 var(--space-3);height:48px;text-align:left;border-bottom:1px solid var(--color-border);font-weight:400;vertical-align:middle}
.inv tbody tr:last-child td{border-bottom:0}
.inv thead th{height:40px;font-size:var(--text-meta);font-weight:600;color:var(--color-muted);background:var(--color-surface);position:sticky;top:56px;z-index:2}
.inv .r{text-align:right;font-variant-numeric:tabular-nums}
.inv .act{text-align:right;width:1%;white-space:nowrap}
.inv td.who{padding-top:var(--space-2);padding-bottom:var(--space-2)}
.who-name{display:inline-flex;align-items:center;min-height:32px;background:none;border:0;padding:0;font-weight:600;cursor:pointer;text-align:left;color:var(--color-text);text-decoration:underline;text-decoration-color:var(--color-border);text-underline-offset:3px}
.who-name:hover{text-decoration-color:var(--color-text)}
.sub{display:block;color:var(--color-muted);font-size:var(--text-caption)}
.st{display:inline-flex;gap:var(--space-1);align-items:center;font-size:var(--text-meta)}
.st.warn{color:var(--color-warning);font-weight:600}
.st.bad{color:var(--color-danger);font-weight:600}
.st svg{width:14px;height:14px}
.owed{color:var(--color-muted);font-size:var(--text-meta);margin-bottom:var(--space-3)}
.dim{color:var(--color-muted)}
.m-only{display:none}
#main:focus{outline:none}
.crew-sec .load{margin-bottom:var(--space-3)}

/* Dialogs */
dialog{color:var(--color-text);background:var(--color-surface);padding:0;border:1px solid var(--color-border)}
dialog::backdrop{background:var(--color-scrim)}
dialog.modal{width:min(540px,calc(100% - 32px));max-height:calc(100dvh - 32px);border-radius:var(--radius-xl);box-shadow:var(--shadow-float);margin:auto}
dialog.modal[open]{display:flex;flex-direction:column}
dialog.drawer{margin:0 0 0 auto;width:min(420px,100%);max-width:100%;height:100dvh;max-height:100dvh;border-radius:0;border-width:0 0 0 1px;box-shadow:var(--shadow-float)}
dialog.drawer[open]{display:flex;flex-direction:column}
@media (prefers-reduced-motion:no-preference){
  dialog.drawer[open]{animation:slide-in var(--motion-sheet) var(--ease-out)}
  dialog.modal[open]{animation:fade-in var(--motion-menu) var(--ease-out)}
  @keyframes slide-in{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
}
dialog.modal{overflow:hidden}
dialog.modal form{display:flex;flex-direction:column;flex:1;min-height:0}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--color-border)}
.dlg-head h2{font-size:var(--text-section);font-weight:600;line-height:var(--leading-heading);overflow-wrap:anywhere}
.dlg-body{padding:var(--space-5);overflow:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--space-4)}
.dlg-foot{display:flex;gap:var(--space-2);justify-content:flex-end;align-items:center;padding:var(--space-3) var(--space-5);border-top:1px solid var(--color-border);flex-wrap:wrap}
.dlg-foot .left{margin-right:auto}
.facts{display:grid;grid-template-columns:96px minmax(0,1fr);gap:var(--space-2) var(--space-3)}
.facts dt{color:var(--color-muted);font-size:var(--text-meta)}
.facts dd{overflow-wrap:anywhere}
.block{border-top:1px solid var(--color-border);padding-top:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.block h3{font-size:var(--text-body);font-weight:600}
.row{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap}
.help{color:var(--color-muted);font-size:var(--text-meta)}
.help.warn{color:var(--color-warning);font-weight:500;display:flex;gap:var(--space-1);align-items:flex-start}

/* Fields */
.field{display:flex;flex-direction:column;gap:var(--space-1);min-width:0}
.field label{font-weight:600;font-size:var(--text-meta)}
.field .req{color:var(--color-muted);font-weight:400}
.field input,.field select,.field textarea{height:var(--control-h);padding:0 var(--space-3);border:1px solid var(--color-field-border);border-radius:var(--radius-md);background:var(--color-surface);width:100%;min-width:0}
.field textarea{height:auto;min-height:64px;padding:var(--space-2) var(--space-3);resize:vertical}
.field input[aria-invalid="true"],.field select[aria-invalid="true"],.field textarea[aria-invalid="true"]{border-color:var(--color-danger);box-shadow:inset 0 0 0 1px var(--color-danger)}
.err{color:var(--color-danger);font-size:var(--text-meta);font-weight:500;display:flex;gap:var(--space-1);align-items:flex-start}
.err svg{margin-top:2px;width:14px;height:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3)}
.errsum{background:var(--color-danger-bg);color:var(--color-danger);border:1px solid #E9B8AE;border-radius:var(--radius-md);padding:var(--space-3);font-weight:500}
.errsum ul{margin-top:var(--space-1);padding-left:var(--space-4);list-style:disc}
.errsum a{color:inherit}
.pay{background:var(--color-sunken);border-radius:var(--radius-md);padding:var(--space-3);font-size:var(--text-meta)}
.pay strong{display:block;font-size:var(--text-caption);color:var(--color-muted);font-weight:600;margin-bottom:2px}

/* Toast */
.toast{position:fixed;inset:auto auto var(--space-6) 50%;margin:0;border:0;overflow:visible;transform:translateX(-50%);z-index:100;background:var(--color-text);color:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-float);padding:var(--space-3) var(--space-4);display:none;gap:var(--space-4);align-items:center;max-width:min(560px,calc(100% - 32px));font-size:var(--text-meta)}
.toast.on,.toast:popover-open{display:flex}
.toast .tbtn{background:none;border:1px solid rgba(255,255,255,.7);color:#fff;border-radius:var(--radius-md);height:32px;padding:0 var(--space-3);font-weight:600;cursor:pointer;white-space:nowrap}
.toast .tbtn:hover{background:rgba(255,255,255,.14)}
.toast .tx{background:none;border:0;color:#fff;cursor:pointer;height:32px;padding:0 var(--space-2);text-decoration:underline;font-weight:500}
.toast :focus-visible{outline-color:#fff}

/* Preview controls (not part of the product) */
.preview{max-width:var(--content-max);margin:0 auto;padding:0 var(--gutter) var(--space-10)}
.preview-in{border:1px dashed var(--color-field-border);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);display:flex;flex-wrap:wrap;gap:var(--space-3) var(--space-5);align-items:center;color:var(--color-muted);font-size:var(--text-meta)}
.preview-in .pfield{display:flex;align-items:center;gap:var(--space-2)}
.preview-in select{height:var(--control-h-compact);border:1px solid var(--color-field-border);border-radius:var(--radius-md);padding:0 var(--space-2);background:var(--color-surface)}
.preview-in .btn{height:var(--control-h-compact)}

/* Narrow: day view and stacked tables */
@media (max-width:999px){
  .board-wrap{display:none}
  .dayview{display:block}
  .bottombar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--color-surface);border-top:1px solid var(--color-border);padding:var(--space-3) var(--gutter)}
  body.view-invoices .bottombar{display:none}
  .bottombar .btn{width:100%;height:var(--control-h-touch)}
  .page{padding-bottom:88px}
  body.view-invoices .page{padding-bottom:var(--space-10)}
  .head-new{display:none}
  .toast{bottom:88px}
  body.view-invoices .toast{bottom:var(--space-6)}
  .preview{padding-bottom:96px}
}
@media (max-width:760px){
  .btn,.seg button{min-height:var(--control-h-touch)}
  .topbar-in{gap:var(--space-3)}
  .brand small{display:none}
  .company{display:none}
  .nav a{height:var(--control-h-touch);padding:0 var(--space-2)}
  .nav .count{display:none}
  .toolbar .range{flex-basis:100%;margin-left:0;order:-1}
  .toolbar .btn{height:var(--control-h-touch)}
  .field input,.field select,.field textarea{height:var(--control-h-touch);font-size:16px}
  .field textarea{height:auto}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  dialog.modal{width:calc(100% - 16px);max-height:calc(100dvh - 16px)}
  .dlg-head,.dlg-body,.dlg-foot{padding-left:var(--space-4);padding-right:var(--space-4)}
  .dlg-foot .btn{flex:1}
  .dlg-foot .left{flex-basis:100%;margin-right:0}
  .dlg-foot .left .btn{width:100%}
  .facts{grid-template-columns:72px minmax(0,1fr)}
  /* Invoices table becomes two-line rows */
  .inv,.inv tbody{display:block;border:0;background:transparent}
  .inv thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .inv tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px var(--space-3);padding:var(--space-3);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);margin-bottom:var(--space-2)}
  .inv td{display:block;height:auto;padding:0;border:0}
  .inv td.who{grid-column:1;grid-row:1}
  .inv td.amt{grid-column:2;grid-row:1;text-align:right}
  .inv td.when{grid-column:1/-1;grid-row:2;color:var(--color-muted);font-size:var(--text-meta)}
  .inv td.status{grid-column:1/-1;grid-row:3}

function seed(){
  var jobs=[], invoices=[], n=0;

  for(var x=1; upcoming.length<4; x++){ var cand=addDays(TODAY,x); if(cand.getDay()!==0) upcoming.push(cand); }
  SEED.forEach(function(r){
    var date = addDays(ANCHOR, r[0]*7 + r[1]);

    n++;

    jobs.push({
      id:'j'+n, crew:r[2], date:iso(date), start:r[3], hours:r[4],
      customer:r[5], email: NO_EMAIL[r[5]] ? '' : slug(r[5].replace(/ residence/,''))+'@example.com',

      invN++;

      if(diffDays(issued,TODAY)>0) issued = TODAY;
      var due = addDays(issued,14);
      var paid = null;
      if(j._marker==='paid'){ paid = addDays(issued,4); if(diffDays(paid,TODAY)>0) paid=TODAY; }
      invoices.push({id:'i'+invN, jobId:j.id, number:'INV-'+('0000'+invN).slice(-4), customer:j.customer, email:j.email, amount:j.price, issued:iso(issued), due:iso(due), paid: paid?iso(paid):null});
    }
    delete j._marker;
  });
  S.jobs=jobs; S.invoices=invoices; S.nextJob=n+1; S.nextInv=invN+1;
}

S = {
  jobs:[], invoices:[], view:'schedule', week: iso(ANCHOR), day: 0, tab:'ready', preview:'populated',

function jobById(id){ for(var i=0;i<S.jobs.length;i++) if(S.jobs[i].id===id) return S.jobs[i]; return null; }
function invoiceForJob(id){ for(var i=0;i<S.invoices.length;i++) if(S.invoices[i].jobId===id) return S.invoices[i]; return null; }

function load(dateIso, crewId){ return cellJobs(dateIso,crewId).reduce(function(s,j){ return s+j.hours; },0); }

function overdueDays(i){ return i.paid ? 0 : Math.max(0, diffDays(TODAY, parseISO(i.due))); }

  var d=weekDays(), a=d[0], b=d[5];

}

/* ---------- toast ---------- */
var toastTimer=null;
function toast(msg, opts){
  opts=opts||{};
  var t=document.getElementById('toast');
  t.innerHTML='<span>'+esc(msg)+'</span>' + (opts.actionLabel?'<button type="button" class="tbtn" data-toast-act>'+esc(opts.actionLabel)+'</button>':'') + '<button type="button" class="tx" data-toast-close>Dismiss</button>';
  t.classList.add('on');
  try{ if(t.showPopover && !t.matches(':popover-open')) t.showPopover(); }catch(err){}
  t._act=opts.action||null;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(hideToast, opts.ms||10000);
}
function hideToast(){ var t=document.getElementById('toast'); t.classList.remove('on'); try{ if(t.hidePopover && t.matches(':popover-open')) t.hidePopover(); }catch(err){} }
document.getElementById('toast').addEventListener('click',function(e){
  var t=e.currentTarget;
  if(e.target.closest('[data-toast-act]')){ var f=t._act; hideToast(); if(f) f(); }

});

function weekStats(){

  days.forEach(function(d){ CREWS.forEach(function(c){ if(load(iso(d),c.id)>CAP) over++; }); });
  return {total:inWeek.length, needs:needs, over:over, ready:readyJobs().length};
}

/* ---------- rendering: invoices ---------- */
function statusCell(i){
  if(i.paid) return '<span class="st">'+icon('check')+'Paid '+dLabel(parseISO(i.paid))+'</span>';
  var od=overdueDays(i);
  if(od>0) return '<span class="st bad">'+icon('alert')+'Overdue '+plural(od,'day')+'</span>';
  var left=diffDays(parseISO(i.due),TODAY);
  return '<span class="st">'+(left===0?'Due today':'Due in '+plural(left,'day'))+'</span>';
}
function invoicesHTML(){
  var head='<div class="page-head"><h1>Invoices</h1></div>';
  if(S.preview==='loading'){
    return head+'<div class="skel" style="height:32px;width:340px;max-width:100%;margin-bottom:12px"></div><div aria-busy="true">'+[1,2,3,4].map(function(){return '<div class="skel" style="margin-bottom:8px;height:48px"></div>';}).join('')+'</div><p class="sr-only">Loading invoices</p>';
  }
  if(S.preview==='error'){
    return head+'<div class="alert" role="alert">'+icon('alert')+'<div class="alert-body">Invoices did not load. Try again.</div><button type="button" class="btn" data-act="retry">Try again</button></div>';
  }
  var ready=readyJobs(), invs=visInvoices();
  var sent=invs.filter(function(i){return !i.paid;}).sort(function(a,b){return a.due<b.due?-1:1;});
  var paid=invs.filter(function(i){return i.paid;}).sort(function(a,b){return a.paid<b.paid?1:-1;});
  var tabs=[['ready','Ready to invoice',ready.length],['sent','Sent',sent.length],['paid','Paid',paid.length]];
  var seg='<div class="seg" role="group" aria-label="Invoice list">'+tabs.map(function(t){
    var on=S.tab===t[0];
    return '<button type="button" data-tab="'+t[0]+'" aria-pressed="'+on+'">'+(on?icon('check'):'')+t[1]+' ('+t[2]+')</button>';
  }).join('')+'</div>';
  var owed='';
  var up=unpaid();
  if(up.length){
    var tot=up.reduce(function(s,i){return s+i.amount;},0), od=up.filter(function(i){return overdueDays(i)>0;}).length;
    owed='<p class="owed num">Outstanding '+money(tot)+' across '+plural(up.length,'invoice')+(od?', '+od+' overdue':'')+'.</p>';
  }
  var table='';
  if(S.tab==='ready'){
    if(!ready.length) table='<div class="empty"><strong>Nothing to invoice.</strong>Finished jobs without an invoice appear here.</div>';
    else table='<table class="inv" role="table"><caption class="sr-only">Finished jobs that are not invoiced</caption><thead><tr><th scope="col">Customer</th><th scope="col">Job date</th><th scope="col" class="r">Amount</th><th scope="col"><span class="sr-only">Action</span></th></tr></thead><tbody>'+
      ready.map(function(j){
        return '<tr><td class="who"><button type="button" class="who-name" data-job="'+j.id+'" aria-haspopup="dialog">'+esc(j.customer)+'</button><span class="sub">'+esc(j.address)+'</span></td><td class="when">'+dLabel(parseISO(j.date))+'</td><td class="r amt">'+(j.price!=null?money(j.price):'<span class="dim">No price</span>')+'</td><td class="act"><button type="button" class="btn" data-invoice="'+j.id+'">Invoice this job</button></td></tr>';
      }).join('')+'</tbody></table>';
  } else if(S.tab==='sent'){
    if(!sent.length) table='<div class="empty"><strong>No unpaid invoices.</strong>Sent invoices that are not paid appear here.</div>';
    else table='<table class="inv" role="table"><caption class="sr-only">Sent invoices that are not paid</caption><thead><tr><th scope="col">Customer</th><th scope="col">Invoice</th><th scope="col">Sent</th><th scope="col">Status</th><th scope="col" class="r">Amount</th><th scope="col"><span class="sr-only">Action</span></th></tr></thead><tbody>'+
      sent.map(function(i){
        return '<tr><td class="who"><button type="button" class="who-name" data-job="'+i.jobId+'" aria-haspopup="dialog">'+esc(i.customer)+'</button></td><td class="extra num">'+i.number+'</td><td class="when num">Sent '+dLabel(parseISO(i.issued))+'<span class="m-only"> &middot; '+i.number+'</span></td><td class="status">'+statusCell(i)+'</td><td class="r amt">'+money(i.amount)+'</td><td class="act"><button type="button" class="btn" data-paid="'+i.id+'">Mark as paid</button></td></tr>';
      }).join('')+'</tbody></table>';
  } else {
    if(!paid.length) table='<div class="empty"><strong>No paid invoices yet.</strong>Invoices you mark as paid appear here.</div>';
    else table='<table class="inv" role="table"><caption class="sr-only">Paid invoices</caption><thead><tr><th scope="col">Customer</th><th scope="col">Invoice</th><th scope="col">Status</th><th scope="col" class="r">Amount</th></tr></thead><tbody>'+
      paid.map(function(i){

      }).join('')+'</tbody></table>';
  }
  return head+seg+owed+table;
}

jobform.addEventListener('submit',function(e){
  e.preventDefault();
  var v=readForm(), errs=[];
  function chk(field,cond,msg){ if(cond){ errs.push([field,msg]); showErr(field,msg); } else showErr(field,null); }
  chk('customer',!v.customer.trim(),'Enter the customer name.');
  chk('email', v.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email.trim()),'Enter a valid email, like name@example.com.');
  chk('address',!v.address.trim(),'Enter the job address.');
  chk('date',!v.date,'Choose a date.');
  chk('start',!v.start,'Choose a start time.');
  chk('services',!v.services.trim(),'Enter what the crew will do.');
  var priceNum=null;
  if(v.price.trim()){ var p=parseFloat(v.price.replace(/[$,\s]/g,'')); if(isNaN(p)||p<0){ errs.push(['price','Enter the price as a number, like 85 or 85.50.']); showErr('price','Enter the price as a number, like 85 or 85.50.'); } else { priceNum=Math.round(p*100); showErr('price',null);} } else showErr('price',null);
  var sum=jobform.querySelector('#jf-sum');
  if(errs.length){
    sum.innerHTML='<div class="errsum"><p>'+(errs.length===1?'Fix 1 thing to save this job:':'Fix '+errs.length+' things to save this job:')+'</p><ul>'+errs.map(function(x){ return '<li><a href="#jf-'+x[0]+'" data-fld="'+x[0]+'">'+esc(x[1])+'</a></li>'; }).join('')+'</ul></div>';
    var f=jobform.querySelector('#jf-'+errs[0][0]); if(f) f.focus();
    return;
  }
  sum.innerHTML='';
  var j;
  var isNew=!formState.id;
  if(isNew){ j={id:'j'+(S.nextJob++), status:'scheduled'}; S.jobs.push(j); } else j=jobById(formState.id);
  j.customer=v.customer.trim(); j.email=v.email.trim(); j.address=v.address.trim(); j.date=v.date; j.start=v.start; j.hours=+v.hours; j.crew=v.crew||null; j.services=v.services.trim(); j.price=priceNum;
  var d=parseISO(j.date);
  var inWeek = diffDays(d,weekStart())>=0 && diffDays(d,weekStart())<=5;
  var msg = (isNew?'Job added for ':'Job saved for ')+dLabel(d)+'.';
  if(inWeek){
    if(window.innerWidth<1000){ S.day=diffDays(d,weekStart()); }
    S.returnFocus={job:j.id}; jobform.close(); toast(msg);
  } else {
    S.returnFocus={sel:'#main'}; jobform.close();
    toast(msg+' It is in another week.', {actionLabel:'Go to that week', action:function(){ goWeek(weekMonday(d)); }, ms:12000});
  }
});
jobform.addEventListener('click',function(e){
  var a=e.target.closest('a[data-fld]'); if(a){ e.preventDefault(); var f=jobform.querySelector('#jf-'+a.dataset.fld); if(f) f.focus(); }
});

/* send invoice */
var sendState=null;
function dueDate(days){ return addDays(TODAY,days); }
function openSend(jobId){
  var j=jobById(jobId);
  sendState={jobId:jobId, sending:false};
  var opts=[7,14,30].map(function(n){ return '<option value="'+n+'"'+(n===S.dueDays?' selected':'')+'>'+n+' days</option>'; }).join('');
  senddlg.innerHTML='<form id="sf" novalidate><div class="dlg-head"><h2 id="sd-title">Invoice this job</h2></div><div class="dlg-body">'+
   '<p>'+esc(j.customer)+', '+dLabel(parseISO(j.date))+'. '+esc(j.services)+'.</p>'+
   '<div id="sf-alert"></div>'+
   '<div class="field"><label for="sf-to">Send to <span class="req">(required)</span></label><input id="sf-to" name="to" type="email" inputmode="email" autocomplete="off" value="'+esc(j.email)+'"><div id="sf-to-e"></div></div>'+
   '<div class="grid2"><div class="field"><label for="sf-amount">Amount in dollars <span class="req">(required)</span></label><input id="sf-amount" name="amount" type="text" inputmode="decimal" autocomplete="off" value="'+(j.price!=null?(j.price/100).toFixed(2):'')+'"><div id="sf-amount-e"></div></div>'+
   '<div class="field"><label for="sf-due">Payment due in</label><select id="sf-due" name="due">'+opts+'</select><p class="help num" id="sf-due-h">Due '+dLabel(dueDate(S.dueDays))+'</p></div></div>'+
   '<div class="pay"><strong>Payment instructions (sample, set in Company details)</strong>Pay by check to Oak &amp; Row Landscaping, or by bank transfer. Details are in the email.</div>'+
   '<p class="help">The customer gets the invoice by email. A sent invoice cannot be unsent. Preview only: nothing is sent from this page.</p>'+
  '</div><div class="dlg-foot"><button type="button" class="btn" data-sd-cancel>Cancel</button><button type="submit" class="btn primary" id="sf-send">Send invoice</button></div></form>';
  senddlg.showModal();
  var f=senddlg.querySelector(j.email?'#sf-amount':'#sf-to'); if(f) f.focus();
}
senddlg.addEventListener('change',function(e){
  if(e.target.id==='sf-due'){ senddlg.querySelector('#sf-due-h').textContent='Due '+dLabel(dueDate(+e.target.value)); }
});
senddlg.addEventListener('click',function(e){
  if(e.target.closest('[data-sd-cancel]')){ if(!sendState.sending) senddlg.close(); }
});
senddlg.addEventListener('cancel',function(e){ if(sendState && sendState.sending) e.preventDefault(); });
function sdErr(field,msg){
  var inp=senddlg.querySelector('#sf-'+field), box=senddlg.querySelector('#sf-'+field+'-e');
  if(msg){ inp.setAttribute('aria-invalid','true'); inp.setAttribute('aria-describedby','sf-'+field+'-m'); box.innerHTML='<p class="err" id="sf-'+field+'-m">'+icon('alert')+'<span>'+esc(msg)+'</span></p>'; }
  else { inp.removeAttribute('aria-invalid'); inp.removeAttribute('aria-describedby'); box.innerHTML=''; }
}
senddlg.addEventListener('submit',function(e){
  e.preventDefault();
  if(sendState.sending) return;
  var f=senddlg.querySelector('#sf'), to=f.elements.to.value.trim(), amt=f.elements.amount.value.replace(/[$,\s]/g,''), days=+f.elements.due.value;
  var bad=null;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)){ sdErr('to','Enter a valid email, like name@example.com.'); bad=bad||'to'; } else sdErr('to',null);
  var a=parseFloat(amt);
  if(!amt || isNaN(a) || a<=0){ sdErr('amount','Enter the amount, like 85 or 85.50.'); bad=bad||'amount'; } else sdErr('amount',null);
  if(bad){ senddlg.querySelector('#sf-'+bad).focus(); return; }
  sendState.sending=true;
  var btn=senddlg.querySelector('#sf-send'); btn.disabled=true; btn.textContent='Sending';
  senddlg.querySelector('[data-sd-cancel]').disabled=true;
  var jobId=sendState.jobId;
  setTimeout(function(){
    var j=jobById(jobId);
    var num='INV-'+('0000'+(S.nextInv++)).slice(-4);
    j.email=to; S.dueDays=days;
    S.invoices.push({id:'i'+num, jobId:jobId, number:num, customer:j.customer, email:to, amount:Math.round(a*100), issued:iso(TODAY), due:iso(dueDate(days)), paid:null});
    sendState.sending=false;
    senddlg.close();
    toast('Invoice '+num+' marked as sent to '+to+'. Preview only: no email left this page.',{ms:12000});
    render();
    if(drawer.open) refreshDrawer('[data-paid]'); else focusMain();
  },700);
});

/* paid */
function markPaid(id){
  var inv=null; S.invoices.forEach(function(i){ if(i.id===id) inv=i; });
  inv.paid=iso(TODAY);
  var wasDrawer=drawer.open;
  render(); if(wasDrawer) refreshDrawer('[data-unpaid]'); else focusMain();
  if(wasDrawer) toast('Invoice '+inv.number+' marked as paid.');
  else toast('Invoice '+inv.number+' for '+inv.customer+' marked as paid.',{actionLabel:'Undo', action:function(){ inv.paid=null; render(); focusMain(); }});
}
function markUnpaid(id){
  var inv=null; S.invoices.forEach(function(i){ if(i.id===id) inv=i; });
  inv.paid=null; render(); refreshDrawer('[data-paid]'); toast('Invoice '+inv.number+' is unpaid again.');
}

/* ---------- navigation ---------- */
function weekMonday(d){ var dow=d.getDay(); var back = dow===0 ? 6 : dow-1; return addDays(d,-back); }
function goWeek(d){
  S.week=iso(d);
  var di=diffDays(TODAY,d); S.day = (di>=0&&di<=5) ? di : 0;
  S.view='schedule';
  S.ignoreHash='#/schedule/'+S.week;
  location.hash='#/schedule/'+S.week;
  render();
  var r=document.getElementById('range'); if(r){ /* announced through live region below */ }
  announce('Showing '+rangeLabel()+'.');
}
var live=document.createElement('div'); live.className='sr-only'; live.setAttribute('role','status'); live.setAttribute('aria-live','polite'); document.body.appendChild(live);
function announce(msg){ live.textContent=''; setTimeout(function(){ live.textContent=msg; },30); }

function route(){
  if(S.ignoreHash && location.hash===S.ignoreHash){ S.ignoreHash=null; return; }
  var h=location.hash||'#/schedule';
  var m=h.match(/^#\/schedule(?:\/(\d{4}-\d{2}-\d{2}))?/);
  if(m){
    S.view='schedule';
    if(m[1]){ var d=parseISO(m[1]); S.week=iso(weekMonday(d)); var di=diffDays(TODAY,parseISO(S.week)); S.day=(di>=0&&di<=5)?di:0; }
  } else if(/^#\/invoices/.test(h)){ S.view='invoices'; }
  render();
}
window.addEventListener('hashchange',route);

/* ---------- global click handling ---------- */
document.addEventListener('click',function(e){
  var t=e.target;
  var go=t.closest('[data-go-ready]'); if(go){ S.tab='ready'; return; }
  var b=t.closest('button'); if(!b) return;
  if(b.closest('dialog')) return;
  if(b.dataset.act==='new-job'){ S.returnFocus={sel:'[data-act="new-job"]'}; openForm(null); }
  else if(b.dataset.act==='prev-week'){ goWeek(addDays(weekStart(),-7)); focusToolbar('prev-week'); }
  else if(b.dataset.act==='next-week'){ goWeek(addDays(weekStart(),7)); focusToolbar('next-week'); }
  else if(b.dataset.act==='this-week'){ goWeek(ANCHOR); focusToolbar('this-week'); }
  else if(b.dataset.act==='retry'){ S.preview='populated'; render(); focusMain(); }
  else if(b.dataset.day){ S.day=+b.dataset.day; render(); var c=document.querySelector('.chip[data-day="'+S.day+'"]'); if(c) c.focus(); }
  else if(b.dataset.tab){ S.tab=b.dataset.tab; render(); var s=document.querySelector('[data-tab="'+S.tab+'"]'); if(s) s.focus(); }
  else if(b.dataset.job){ S.returnFocus={job:b.dataset.job}; openDrawer(b.dataset.job); }
  else if(b.dataset.invoice){ S.returnFocus={sel:'[data-invoice="'+b.dataset.invoice+'"]'}; openSend(b.dataset.invoice); }
  else if(b.dataset.paid){ markPaid(b.dataset.paid); }
});
function focusToolbar(act){ var el=document.querySelector('[data-act="'+act+'"]'); if(el) el.focus(); }

/* preview controls */
document.getElementById('pv-state').addEventListener('change',function(e){ S.preview=e.target.value; render(); });
document.getElementById('pv-reset').addEventListener('click',function(){ seed(); S.preview='populated'; S.week=iso(ANCHOR); S.tab='ready'; render(); toast('Sample data reset.',{ms:4000}); });

/* keep chips in sync on resize across the breakpoint */
route();
if(!location.hash) { /* default route stays on schedule without forcing a hash */ }
})();
</script>
</body>
</html>
