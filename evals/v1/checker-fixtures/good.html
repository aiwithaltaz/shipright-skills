<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
<style>
:root{--ink:#16181d;--muted:#5b616e;--line:#e3e5e9;--bg:#fff;--accent:#1f5eff}
*{box-sizing:border-box} body{margin:0;font:15px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
main{max-width:960px;margin:0 auto;padding:24px 16px}
h1{font-size:24px;margin:0 0 16px}
label{display:block;font-weight:600;margin:0 0 4px}
input{width:100%;min-height:44px;padding:8px 12px;border:1px solid #8a909c;border-radius:6px;font:inherit}
button{min-height:44px;min-width:44px;padding:0 16px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:inherit;font-weight:600;transition:background-color .15s}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
p{color:var(--muted)}
</style></head><body><main>
<h1>Projects</h1>
<form><label for="q">Search projects</label><input id="q" name="q" autocomplete="off"><p>Search by client or project name.</p><button type="submit">Search</button></form>
</main></body></html>
