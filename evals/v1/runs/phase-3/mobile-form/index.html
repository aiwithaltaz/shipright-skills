<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your home, booking preview</title>
<meta name="description" content="Preview of screen S3 Your home (Step 2 of 4) in the first-cleaning booking flow. Proposed design tokens.">
<style>
  :root {
    /* Proposed (delegated) tokens, mirror of design/tokens.ts */
    --color-bg: #FFFFFF;
    --color-sunken: #F3F4F6;
    --color-text: #121417;
    --color-muted: #5A616B;
    --color-border: #E3E6EA;
    --color-field-border: #868D97;
    --color-accent: #0B6E8A;
    --color-accent-pressed: #095A71;
    --color-accent-tint: #E8F3F6;
    --color-on-accent: #FFFFFF;
    --color-danger: #C1341F;
    --color-danger-tint: #FCEBE7;
    --color-success: #1B7A4B;
    --color-success-tint: #E7F5EE;

    --font: -apple-system, "SF Pro Text", Roboto, "Segoe UI", sans-serif;

    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px;
    --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px;

    --radius-control: 10px;
    --size-target: 48px;
    --size-field: 52px;
    --size-button: 52px;
    --size-top-bar: 48px;
    --side: 20px;

    --motion-press: 120ms;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--color-sunken);
    color: var(--color-text);
    font-family: var(--font);
    font-size: 17px;
    line-height: 24px;
    -webkit-text-size-adjust: 100%;
  }

  .screen {
    background: var(--color-bg);
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  @media (min-width: 600px) {
    body { display: flex; align-items: flex-start; justify-content: center; padding: var(--space-6) 0; }
    .screen { width: 390px; height: 844px; border: 1px solid var(--color-border); }
  }

  /* Top bar */
  .top-bar {
    flex: none;
    height: var(--size-top-bar);
    margin-top: env(safe-area-inset-top);
    padding: 0 var(--side) 0 var(--space-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .back {
    display: inline-flex; align-items: center; gap: var(--space-1);
    min-height: var(--size-target); min-width: var(--size-target);
    padding: 0 var(--space-3) 0 var(--space-1);
    border: 0; background: none; border-radius: var(--radius-control);
    color: var(--color-accent); font: 600 17px/24px var(--font); cursor: pointer;
  }
  .back svg { width: 24px; height: 24px; }
  .step { color: var(--color-muted); font-size: 13px; line-height: 18px; }

  /* Scroll area */
  .content {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: var(--space-2) var(--side) var(--space-8);
  }
  h1 { margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; }
  .lead { margin: var(--space-2) 0 0; color: var(--color-muted); }

  fieldset { border: 0; margin: var(--space-8) 0 0; padding: 0; min-width: 0; }
  legend.group { padding: 0; font-size: 20px; line-height: 26px; font-weight: 600; margin-bottom: var(--space-4); }

  .field + .field { margin-top: var(--space-5); }
  .field > label, .choice legend {
    display: block; font-size: 15px; line-height: 20px; font-weight: 600; padding: 0;
  }
  .optional { font-weight: 400; color: var(--color-muted); }
  .hint { margin: var(--space-1) 0 0; font-size: 15px; line-height: 20px; color: var(--color-muted); }

  input[type="text"], textarea {
    display: block; width: 100%;
    margin-top: var(--space-2);
    font: 400 17px/24px var(--font);
    color: var(--color-text);
    background: var(--color-bg);
    border: 1px solid var(--color-field-border);
    border-radius: var(--radius-control);
    padding: 0 14px;
    height: var(--size-field);
    transition: border-color var(--motion-press) ease-out, box-shadow var(--motion-press) ease-out;
  }
  textarea { height: auto; min-height: 104px; padding: var(--space-3) 14px; resize: vertical; }
  input::placeholder, textarea::placeholder { color: var(--color-muted); }
  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: var(--color-accent);
    box-shadow: 0 0 0 1px var(--color-accent);
  }
  [aria-invalid="true"] { border-color: var(--color-danger) !important; box-shadow: 0 0 0 1px var(--color-danger) !important; }
  [aria-invalid="true"]:focus { box-shadow: 0 0 0 1px var(--color-danger), 0 0 0 4px var(--color-bg), 0 0 0 6px var(--color-accent) !important; }

  .error {
    display: flex; gap: var(--space-2); align-items: flex-start;
    margin: var(--space-2) 0 0; color: var(--color-danger);
    font-size: 15px; line-height: 20px;
  }
  .error svg { flex: none; width: 16px; height: 16px; margin-top: 2px; }
  .error[hidden] { display: none; }

  /* Radio chips */
  .choice { border: 0; padding: 0; margin: 0; min-width: 0; }
  .choice + .choice { margin-top: var(--space-6); }
  .chips { display: grid; gap: var(--space-2); margin-top: var(--space-2); }
  .chips.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .chips.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; inset: 0; margin: 0; width: 100%; height: 100%; cursor: pointer; }
  .chip span {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    min-height: var(--size-target);
    padding: 0 var(--space-1);
    border: 1px solid var(--color-field-border);
    border-radius: var(--radius-control);
    background: var(--color-bg);
    font-size: 17px; line-height: 24px;
    transition: background var(--motion-press) ease-out, border-color var(--motion-press) ease-out;
  }
  .chip svg { width: 16px; height: 16px; display: none; color: var(--color-accent); flex: none; }
  .chip input:checked + span {
    border: 2px solid var(--color-accent);
    background: var(--color-accent-tint);
    font-weight: 600;
  }
  .chip input:checked + span svg { display: block; }
  .chip input:focus-visible + span { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .choice.invalid .chip span { border-color: var(--color-danger); }

  .counter { margin: var(--space-1) 0 0; font-size: 13px; line-height: 18px; color: var(--color-muted); text-align: right; }

  /* Bottom bar */
  .bottom-bar {
    flex: none;
    background: var(--color-sunken);
    border-top: 1px solid var(--color-border);
    padding: var(--space-3) var(--side) calc(var(--space-3) + env(safe-area-inset-bottom));
  }
  .bar-note { margin: 0 0 var(--space-3); font-size: 15px; line-height: 20px; color: var(--color-muted); }
  .alert {
    display: flex; gap: var(--space-2); align-items: flex-start;
    margin: 0 0 var(--space-3); padding: var(--space-3);
    border-radius: var(--radius-control);
    font-size: 15px; line-height: 20px;
  }
  .alert svg { flex: none; width: 20px; height: 20px; }
  .alert.danger { background: var(--color-danger-tint); color: var(--color-danger); }
  .alert.danger p { color: var(--color-text); margin: 0; }
  .alert.info { background: var(--color-accent-tint); color: var(--color-accent); }
  .alert.info p { color: var(--color-text); margin: 0; }
  .alert[hidden], .bar-note[hidden] { display: none; }

  .primary {
    display: flex; align-items: center; justify-content: center; gap: var(--space-2);
    width: 100%; height: var(--size-button);
    border: 0; border-radius: var(--radius-control);
    background: var(--color-accent); color: var(--color-on-accent);
    font: 600 17px/24px var(--font);
    cursor: pointer;
    transition: background var(--motion-press) ease-out;
  }
  .primary:active { background: var(--color-accent-pressed); }
  .primary[aria-disabled="true"] { cursor: progress; }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.45); border-top-color: var(--color-on-accent);
    animation: spin 800ms linear infinite;
  }
  .spinner[hidden] { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .primary:focus-visible { outline-color: var(--color-text); }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
    .spinner { animation: none; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
</svg>

<div class="screen">
  <header class="top-bar">
    <button type="button" class="back" id="back">
      <svg aria-hidden="true"><use href="#i-chevron"/></svg>Back
    </button>
    <span class="step">Step 2 of 4</span>
  </header>

  <main class="content" id="content">
    <h1>Your home</h1>
    <p class="lead">Where should we come to clean?</p>

    <form id="home-form" novalidate>
      <fieldset>
        <legend class="group">Address</legend>

        <div class="field">
          <label for="line1">Street address</label>
          <input type="text" id="line1" name="line1" autocomplete="address-line1" aria-describedby="line1-error" required>
          <p class="error" id="line1-error" hidden><svg aria-hidden="true"><use href="#i-alert"/></svg><span></span></p>
        </div>

        <div class="field">
          <label for="line2">Apartment, suite or floor <span class="optional">(optional)</span></label>
          <input type="text" id="line2" name="line2" autocomplete="address-line2">
        </div>

        <div class="field">
          <label for="city">City</label>
          <input type="text" id="city" name="city" autocomplete="address-level2" aria-describedby="city-error" required>
          <p class="error" id="city-error" hidden><svg aria-hidden="true"><use href="#i-alert"/></svg><span></span></p>
        </div>

        <div class="field">
          <label for="postcode">Postcode</label>
          <input type="text" id="postcode" name="postcode" autocomplete="postal-code" autocapitalize="characters" spellcheck="false" aria-describedby="postcode-error" required>
          <p class="error" id="postcode-error" hidden><svg aria-hidden="true"><use href="#i-alert"/></svg><span></span></p>
        </div>
      </fieldset>

      <fieldset>
        <legend class="group">Home size</legend>

        <fieldset class="choice" id="bedrooms-group" aria-describedby="bedrooms-error">
          <legend>Bedrooms</legend>
          <div class="chips cols-3">
            <label class="chip"><input type="radio" name="bedrooms" value="0"><span><svg aria-hidden="true"><use href="#i-check"/></svg>Studio</span></label>
            <label class="chip"><input type="radio" name="bedrooms" value="1"><span><svg aria-hidden="true"><use href="#i-check"/></svg>1</span></label>
            <label class="chip"><input type="radio" name="bedrooms" value="2"><span><svg aria-hidden="true"><use href="#i-check"/></svg>2</span></label>
            <label class="chip"><input type="radio" name="bedrooms" value="3"><span><svg aria-hidden="true"><use href="#i-check"/></svg>3</span></label>
            <label class="chip"><input type="radio" name="bedrooms" value="4"><span><svg aria-hidden="true"><use href="#i-check"/></svg>4</span></label>
            <label class="chip"><input type="radio" name="bedrooms" value="5" aria-label="5 or more"><span><svg aria-hidden="true"><use href="#i-check"/></svg>5+</span></label>
          </div>
          <p class="error" id="bedrooms-error" hidden><svg aria-hidden="true"><use href="#i-alert"/></svg><span></span></p>
        </fieldset>

        <fieldset class="choice" id="bathrooms-group" aria-describedby="bathrooms-error">
          <legend>Bathrooms</legend>
          <div class="chips cols-4">
            <label class="chip"><input type="radio" name="bathrooms" value="1"><span><svg aria-hidden="true"><use href="#i-check"/></svg>1</span></label>
            <label class="chip"><input type="radio" name="bathrooms" value="2"><span><svg aria-hidden="true"><use href="#i-check"/></svg>2</span></label>
            <label class="chip"><input type="radio" name="bathrooms" value="3"><span><svg aria-hidden="true"><use href="#i-check"/></svg>3</span></label>
            <label class="chip"><input type="radio" name="bathrooms" value="4" aria-label="4 or more"><span><svg aria-hidden="true"><use href="#i-check"/></svg>4+</span></label>
          </div>
          <p class="error" id="bathrooms-error" hidden><svg aria-hidden="true"><use href="#i-alert"/></svg><span></span></p>
        </fieldset>
      </fieldset>

      <fieldset>
        <legend class="sr-only">Notes</legend>
        <div class="field">
          <label for="notes">Notes for the cleaner <span class="optional">(optional)</span></label>
          <p class="hint" id="notes-hint">Parking, pets, or how to get in.</p>
          <textarea id="notes" name="notes" maxlength="500" aria-describedby="notes-hint notes-count" placeholder="Example: Ring flat 4B. The cat stays in the bedroom."></textarea>
          <p class="counter" id="notes-count" aria-live="polite" hidden></p>
        </div>
      </fieldset>
    </form>
  </main>

  <footer class="bottom-bar">
    <div class="alert danger" id="save-alert" role="alert" hidden>
      <svg aria-hidden="true"><use href="#i-alert"/></svg>
      <p>Your home wasn't saved. Check your connection and try again.</p>
    </div>
    <div class="alert info" id="preview-alert" role="status" hidden>
      <svg aria-hidden="true"><use href="#i-info"/></svg>
      <p id="preview-text"></p>
    </div>
    <p class="bar-note" id="bar-note">Saved to your account when you continue.</p>
    <button type="submit" form="home-form" class="primary" id="continue">
      <span class="spinner" id="spinner" hidden aria-hidden="true"></span>
      <span id="continue-label">Continue</span>
    </button>
    <p class="sr-only" id="status" role="status" aria-live="polite"></p>
  </footer>
</div>

<script>
(function () {
  var form = document.getElementById('home-form');
  var btn = document.getElementById('continue');
  var label = document.getElementById('continue-label');
  var spinner = document.getElementById('spinner');
  var status = document.getElementById('status');
  var saveAlert = document.getElementById('save-alert');
  var previewAlert = document.getElementById('preview-alert');
  var previewText = document.getElementById('preview-text');
  var barNote = document.getElementById('bar-note');
  var notes = document.getElementById('notes');
  var counter = document.getElementById('notes-count');
  var busy = false;

  var messages = {
    line1: 'Enter your street address.',
    city: 'Enter your city.',
    postcode: 'Enter your postcode.',
    bedrooms: 'Choose how many bedrooms.',
    bathrooms: 'Choose how many bathrooms.'
  };

  function showError(id, text) {
    var err = document.getElementById(id + '-error');
    err.querySelector('span').textContent = text;
    err.hidden = false;
    var input = document.getElementById(id);
    if (input) input.setAttribute('aria-invalid', 'true');
    var group = document.getElementById(id + '-group');
    if (group) group.classList.add('invalid');
  }
  function clearError(id) {
    var err = document.getElementById(id + '-error');
    err.hidden = true;
    var input = document.getElementById(id);
    if (input) input.removeAttribute('aria-invalid');
    var group = document.getElementById(id + '-group');
    if (group) group.classList.remove('invalid');
  }
  function radioValue(name) {
    var r = form.querySelector('input[name="' + name + '"]:checked');
    return r ? r.value : '';
  }
  function checkText(id) {
    var v = document.getElementById(id).value.trim();
    if (!v) { showError(id, messages[id]); return false; }
    clearError(id); return true;
  }

  // Validate on leaving a field, never while typing.
  ['line1', 'city', 'postcode'].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener('blur', function () {
      if (el.dataset.touched === 'true' || el.value.trim()) { el.dataset.touched = 'true'; checkText(id); }
    });
    el.addEventListener('input', function () {
      if (el.getAttribute('aria-invalid') === 'true' && el.value.trim()) clearError(id);
    });
  });
  ['bedrooms', 'bathrooms'].forEach(function (name) {
    form.querySelectorAll('input[name="' + name + '"]').forEach(function (r) {
      r.addEventListener('change', function () { clearError(name); });
    });
  });

  notes.addEventListener('input', function () {
    var n = notes.value.length;
    counter.hidden = n < 400;
    counter.textContent = n + ' of 500 characters';
  });

  function setBusy(on) {
    busy = on;
    btn.setAttribute('aria-disabled', on ? 'true' : 'false');
    spinner.hidden = !on;
    label.textContent = on ? 'Checking your area...' : 'Continue';
    if (on) status.textContent = 'Checking your area.';
  }

  function validateAll() {
    var order = ['line1', 'city', 'postcode', 'bedrooms', 'bathrooms'];
    var firstBad = null;
    order.forEach(function (id) {
      var ok;
      if (id === 'bedrooms' || id === 'bathrooms') {
        ok = !!radioValue(id);
        if (!ok) showError(id, messages[id]); else clearError(id);
      } else {
        ok = checkText(id);
      }
      if (!ok && !firstBad) firstBad = id;
    });
    return firstBad;
  }

  function focusField(id) {
    var el = document.getElementById(id);
    if (!el) el = form.querySelector('input[name="' + id + '"]');
    el.focus();
    el.scrollIntoView({ block: 'center' });
  }

  function hideBarMessages() {
    saveAlert.hidden = true;
    previewAlert.hidden = true;
    barNote.hidden = false;
  }

  function showPreview(text) {
    barNote.hidden = true;
    saveAlert.hidden = true;
    previewText.textContent = text;
    previewAlert.hidden = false;
  }

  // Preview-only outcome of the area check and save. The real app calls in_service_area, then saves.
  var previewOutcome = 'ok';

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    hideBarMessages();
    var firstBad = validateAll();
    if (firstBad) {
      status.textContent = 'Some answers need attention.';
      focusField(firstBad);
      return;
    }
    setBusy(true);
    setTimeout(function () {
      setBusy(false);
      if (previewOutcome === 'out-of-area') {
        var pc = document.getElementById('postcode').value.trim().toUpperCase();
        showError('postcode', "We don't clean in " + pc + " yet. Check the postcode is right.");
        focusField('postcode');
        status.textContent = '';
      } else if (previewOutcome === 'save-failed') {
        barNote.hidden = true;
        saveAlert.hidden = false;
        status.textContent = '';
      } else {
        showPreview('Preview only. In the app, your home is saved and Choose a time opens next.');
      }
      previewOutcome = 'ok';
    }, 1200);
  });

  document.getElementById('back').addEventListener('click', function () {
    showPreview('Preview only. Back opens Your details. What you typed here stays.');
  });

  // Preview states by URL hash: #filled, #errors, #checking, #out-of-area, #save-failed
  function fillSample() {
    document.getElementById('line1').value = '12 Sample Street';
    document.getElementById('city').value = 'Sampletown';
    document.getElementById('postcode').value = 'AB1 2CD';
    form.querySelector('input[name="bedrooms"][value="2"]').checked = true;
    form.querySelector('input[name="bathrooms"][value="1"]').checked = true;
  }
  var state = (location.hash || '').slice(1);
  if (state === 'filled') { fillSample(); }
  if (state === 'errors') { form.requestSubmit ? form.requestSubmit() : btn.click(); }
  if (state === 'checking') { fillSample(); validateAll(); setBusy(true); }
  if (state === 'out-of-area' || state === 'save-failed') {
    fillSample();
    previewOutcome = state;
    form.requestSubmit ? form.requestSubmit() : btn.click();
  }
})();
</script>
</body>
</html>
